  const eg = ctx.createLinearGradient(0, y, 0, y + 22);
  eg.addColorStop(0, 'rgba(50,30,30,0.32)'); eg.addColorStop(1, 'rgba(50,30,30,0)');
  ctx.fillStyle = eg; ctx.fillRect(x, y, w, 22);
  ctx.strokeStyle = inkCol(); ctx.lineWidth = 1.8; ctx.strokeRect(x, y, w, h);
}
function windowAt(x, y, w, h, trim, lit, opts = {}) {
  ctx.fillStyle = col(shade(trim, 0.55)); rrect(ctx, x - 3, y - 3, w + 6, h + 6, 3); ctx.fill();
  if (opts.arch) { ctx.beginPath(); ctx.arc(x + w / 2, y + 2, w / 2 + 3, Math.PI, 0); ctx.fill(); }
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  if (lit) { g.addColorStop(0, '#ffe2a0'); g.addColorStop(1, lit === 'blue' ? '#9fc8ff' : '#ffb760'); }
  else { g.addColorStop(0, col('#7f98a8')); g.addColorStop(1, col('#4a5e6e')); }
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  if (opts.arch) { ctx.beginPath(); ctx.arc(x + w / 2, y + 1, w / 2, Math.PI, 0); ctx.fill(); }
  if (!lit) { ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.moveTo(x + 2, y + h - 2); ctx.lineTo(x + w * 0.5, y + 2); ctx.lineTo(x + w * 0.7, y + 2); ctx.lineTo(x + 4, y + h - 2); ctx.fill(); }
  ctx.strokeStyle = col(shade(trim, 0.4)); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h); ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.stroke();
  if (opts.shutters !== false) {
    ctx.fillStyle = col(trim);
    ctx.fillRect(x - 11, y - 2, 8, h + 4); ctx.fillRect(x + w + 3, y - 2, 8, h + 4);
    ctx.strokeStyle = col(shade(trim, -0.3)); ctx.lineWidth = 1;
    for (let j = 3; j < h; j += 4) { ctx.beginPath(); ctx.moveTo(x - 10, y + j); ctx.lineTo(x - 4, y + j); ctx.moveTo(x + w + 4, y + j); ctx.lineTo(x + w + 10, y + j); ctx.stroke(); }
  }
  ctx.fillStyle = col('#cdbb9c'); ctx.fillRect(x - 5, y + h + 2, w + 10, 4);
  if (opts.flowers) {
    ctx.fillStyle = col('#a0603a'); ctx.fillRect(x - 3, y + h + 5, w + 6, 7);
    const R = rng(Math.floor(x * 7 + y));
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = col('#4f8a3a'); circle(ctx, x + i * (w / 5), y + h + 4, 3.5); ctx.fill();
      ctx.fillStyle = col(['#ff6f6f', '#ffd34e', '#f78fb0', '#ffffff'][(R() * 4) | 0]); circle(ctx, x + i * (w / 5) + (R() - 0.5) * 3, y + h + 1, 2.4); ctx.fill();
    }
  }
}
function doorAt(x, y, w, h, color, opts = {}) {
  ctx.fillStyle = col('#8a7a62'); ctx.fillRect(x - 6, y + h - 2, w + 12, 5);
  ctx.fillStyle = col(shade(color, 0.4)); ctx.beginPath(); ctx.moveTo(x - 4, y + h); ctx.lineTo(x - 4, y + 10); ctx.arc(x + w / 2, y + 10, w / 2 + 4, Math.PI, 0); ctx.lineTo(x + w + 4, y + h); ctx.fill();
  ctx.fillStyle = col(color); ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + 10); ctx.arc(x + w / 2, y + 10, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.fill();
  ctx.strokeStyle = col(shade(color, -0.3)); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + w / 2, y + 4); ctx.lineTo(x + w / 2, y + h); ctx.stroke();
  ctx.fillStyle = col('#e8c25a'); circle(ctx, x + w * 0.7, y + h * 0.6, 1.8); ctx.fill();

    for (const px of [x - 14, x + w + 14]) {
      ctx.fillStyle = col('#b0603e'); ctx.beginPath(); ctx.moveTo(px - 7, y + h - 12); ctx.lineTo(px + 7, y + h - 12); ctx.lineTo(px + 5, y + h); ctx.lineTo(px - 5, y + h); ctx.fill();
      ctx.fillStyle = col('#4f8a3a'); circle(ctx, px, y + h - 18, 8); ctx.fill(); circle(ctx, px - 4, y + h - 22, 5); ctx.fill();
      ctx.fillStyle = col('#ff7a8a'); circle(ctx, px + 3, y + h - 22, 2.4); ctx.fill(); circle(ctx, px - 3, y + h - 15, 2.2); ctx.fill();
    }
  }
}
function vines(x, y, w, h, amt, seed) {
  if (amt <= 0) return;
  const R = rng(seed);
  ctx.strokeStyle = col('#4f7f36'); ctx.lineWidth = 1.6;
  const n = Math.floor(amt * 5);
  for (let i = 0; i < n; i++) {
    const vx = x + R() * w; let vy = y + h;
    ctx.beginPath(); ctx.moveTo(vx, vy);
    const len = h * (0.4 + R() * 0.5) * amt;
    for (let k = 0; k < len; k += 8) { ctx.quadraticCurveTo(vx + (R() - 0.5) * 12, vy - k - 4, vx + (R() - 0.5) * 8, vy - k - 8); }
    ctx.stroke();
    ctx.fillStyle = col('#5f9a44');
    for (let k = 0; k < len; k += 7) { circle(ctx, vx + (R() - 0.5) * 12, vy - k, 3); ctx.fill(); }
    if (amt > 0.7) { ctx.fillStyle = col('#e46aa0'); for (let k = 0; k < len; k += 18) { circle(ctx, vx + (R() - 0.5) * 10, vy - k - 4, 2.2); ctx.fill(); } }

}
function homeLit(id) {
  const n = NPCS[id], b = currentBlock(id), m = S.minute % 1440;
  if (!b.hidden) return false;
  if (b.act === 'away') return false;
  if (m > 22.3 * 60 || m < 6 * 60) return false;
  if (b.gig) return 'blue';
  return true;
}
function bloomFor(id) { return Math.max(S.warmth - 0.15, (H(id).energy - 45) / 50); }

function drawBuilding(key, b) {
  const front = b.y + b.d, top = front - b.h;
  const x = b.x, w = b.w;
  buildingShadow(x, w, front, top);
  sideWall(x + w, top, front, b.kind === 'shed' ? '#8f7a62' : b.wall);
  const night = lightLevel();
  if (b.kind === 'house') {
    const id = key;
    wallRect(x, top, w, b.h, b.wall, x);
    const lit = night > 0.2 && homeLit(id);
    const fl = bloomFor(id) > 0.3;
    windowAt(x + 26, top + 34, 30, 34, b.trim, lit, { flowers: fl });
    windowAt(x + w - 56, top + 34, 30, 34, b.trim, lit, { flowers: fl });

const LIGHTS = [];
function lightLevel() {

}
const TINT_KEYS = [

  [960, '#ffe2b4', 0.06], [1060, '#ff9c58', 0.2], [1150, '#9a5a8a', 0.34], [1230, '#2a2d62', 0.55], [1440, '#1a2550', 0.62],

function tintAt(m) {

}
function drawLighting(view) {

  const mul = mixHex('#ffffff', tint.c, clamp(a * 1.35, 0, 1));
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = mul; ctx.fillRect(0, 0, cvs.width, cvs.height);
  if (S.weather !== 'sunny') { ctx.fillStyle = S.weather === 'cloudy' ? '#eef0f2' : '#d2d6dc'; ctx.fillRect(0, 0, cvs.width, cvs.height); }
  ctx.globalCompositeOperation = 'source-over';
  // haze of a tired town
  ctx.fillStyle = `rgba(150,158,172,${0.08 * (1 - S.warmth)})`; ctx.fillRect(0, 0, cvs.width, cvs.height);
  // warm glow of a living one

    const g = ctx.createRadialGradient(cvs.width * 0.2, -cvs.height * 0.1, 0, cvs.width * 0.2, -cvs.height * 0.1, cvs.width);
    g.addColorStop(0, `rgba(255,214,140,${0.16 * (S.warmth - 0.3)})`); g.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, 0, cvs.width, cvs.height); ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  // lights

    for (const l of LIGHTS) {
      if (l.x < view.x0 - 100 || l.x > view.x1 + 100 || l.y < view.y0 - 100 || l.y > view.y1 + 200) continue;
      const amp = (l.a || 0.5) * L;

  vg.addColorStop(0, 'rgba(20,16,30,0)'); vg.addColorStop(1, `rgba(20,16,30,${0.28 - S.warmth * 0.1})`);

function speech(x, y, text, a, bot) {

  lines.push(cur);

  rrect(ctx, x - wd / 2, y - ht, wd, ht, 9); ctx.fill(); ctx.stroke();

}

function progressBar(x, y, p, label) {

// ---------- projects, creations, helper robots ----------
const WORKERS = [];
let FERRY_PATH = null;

function pathLen(p) { let d = 0; for (let i = 1; i < p.length; i++) d += dist(p[i - 1].x, p[i - 1].y, p[i].x, p[i].y); return d; }
function pathAt(p, s) {
  for (let i = 1; i < p.length; i++) {
    const d = dist(p[i - 1].x, p[i - 1].y, p[i].x, p[i].y);
    if (s <= d) { const t = s / d; return { x: lerp(p[i - 1].x, p[i].x, t), y: lerp(p[i - 1].y, p[i].y, t), dx: p[i].x - p[i - 1].x }; }
    s -= d;
  }
  const l = p[p.length - 1]; return { x: l.x, y: l.y, dx: 0 };
}

function updateWorkers() {
  WORKERS.length = 0;
  const m = S.minute % 1440;
  const day = m > 6.5 * 60 && m < 20 * 60;
  const site = (lot, n, color) => {
    const L = LOTS[lot];
    for (let i = 0; i < n; i++) {
      const a = TIME * 0.4 + i * 2.1;
      WORKERS.push({ x: L.x + L.w / 2 + Math.cos(a) * L.w * 0.42, y: L.y + L.d + 14 + Math.sin(a * 1.3) * 12, color, carry: i % 2 === 0, facing: Math.sin(a) > 0 ? -1 : 1, seed: i, visible: true });
      if (Math.random() < 0.05) spawn('spark', L.x + L.w / 2 + Math.cos(a) * L.w * 0.42, L.y + L.d - 10, { life: 0.5 });
    }
  };
  for (const pid in PROJECTS) if (S.projects[pid].status === 'building') site(PROJECTS[pid].lot, 3, '#e8b23a');
  for (const cid in CREATIONS) if (S.creations[cid].status === 'building') site(CREATIONS[cid].lot, S.creations[cid].approach === 'hand' ? 1 : 3, '#e8b23a');
  if (online('workshop') && day) {
    if (!FERRY_PATH) { FERRY_PATH = findPath(1700, 1012, 1150, 1600); FERRY_PATH.unshift({ x: 1700, y: 1012 }); }
    const len = pathLen(FERRY_PATH);
    const n = S.projects.workshop.upgrades.bay ? 3 : 2;
    for (let i = 0; i < n; i++) {
      let s = (TIME * 34 + i * len * 0.66) % (len * 2);
      const back = s > len; if (back) s = len * 2 - s;
      const p = pathAt(FERRY_PATH, s);
      WORKERS.push({ x: p.x, y: p.y, color: '#4fb3a8', carry: !back, facing: (back ? -p.dx : p.dx) > 0 ? 1 : -1, seed: i + 5, visible: true });
    }
  }
  if (online('solar') && day) {
    const L = LOTS.solar; const r = Math.floor(TIME / 12) % 3;
    const t = (TIME % 12) / 12;
    WORKERS.push({ x: L.x + 30 + t * (L.w - 60), y: L.y + 56 + r * 60, color: '#7fb0e0', carry: false, facing: 1, seed: 9, visible: true });
  }
  if (online('greenhouse') && day) {
    const L = LOTS.greenhouse;
    WORKERS.push({ x: L.x + 30 + (Math.sin(TIME * 0.3) * 0.5 + 0.5) * (L.w - 60), y: L.y + L.d + 8, color: '#8ac06a', carry: true, facing: Math.cos(TIME * 0.3) > 0 ? 1 : -1, seed: 11, visible: true });
  }
}

function sparkle(x, y) {
  const s = 1 + Math.sin(TIME * 4) * 0.25;
  ctx.save(); ctx.translate(x, y - 10 + Math.sin(TIME * 2) * 3); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,230,140,0.95)';
  ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, r = i % 2 ? 3 : 9; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill();
  ctx.restore();

}

function panelQuad(x0, x1, yb, yt, inset, glint) {
  const g = ctx.createLinearGradient(0, yt, 0, yb);
  g.addColorStop(0, col('#3e6aa8')); g.addColorStop(1, col('#1f3a66'));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(x1, yb); ctx.lineTo(x1 - inset, yt); ctx.lineTo(x0 + inset, yt); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = col('#8fb4e0', 0.5); ctx.lineWidth = 1;
  for (let j = 1; j < 3; j++) { const y = lerp(yb, yt, j / 3); const t = j / 3; ctx.beginPath(); ctx.moveTo(lerp(x0, x0 + inset, t), y); ctx.lineTo(lerp(x1, x1 - inset, t), y); ctx.stroke(); }
  const n = Math.max(2, Math.round((x1 - x0) / 18));
  for (let i = 1; i < n; i++) { ctx.beginPath(); ctx.moveTo(lerp(x0, x1, i / n), yb); ctx.lineTo(lerp(x0 + inset, x1 - inset, i / n), yt); ctx.stroke(); }
  if (glint) {
    const gx = x0 + ((TIME * 60 + glint) % ((x1 - x0) + 160)) - 80;
    const gg = ctx.createLinearGradient(gx - 30, 0, gx + 30, 0);
    gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(0.5, 'rgba(255,255,255,0.35)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gg; ctx.fillRect(gx - 30, yt, 60, yb - yt);
  }
  ctx.restore();
  ctx.strokeStyle = col('#c8ced6'); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(x1, yb); ctx.lineTo(x1 - inset, yt); ctx.lineTo(x0 + inset, yt); ctx.closePath(); ctx.stroke();
}

function drawSolarRow(r, prog, sp) {
  const L = LOTS.solar;
  const gy = L.y + 50 + r * 60; // ground line of this row
  const x0 = L.x + 20, x1 = L.x + L.w - 20;
  const segs = 5, segW = (x1 - x0) / segs;

  const style = sp.style || 'rows';

  ctx.fillStyle = 'rgba(25,30,40,0.22)'; ctx.fillRect(x0, gy - 6, x1 - x0, 10);
  if (style === 'rows' && S.warmth > 0.2) {
    const R = rng(r + 3);
    for (let i = 0; i < 26; i++) { ctx.fillStyle = col(['#ffd34e', '#f78fb0', '#ffffff', '#b48cf0'][(R() * 4) | 0]); circle(ctx, x0 + R() * (x1 - x0), gy + 6 + R() * 18, 2.2); ctx.fill(); }
  }
  for (let i = 0; i < segs; i++) {

        ctx.strokeRect(sx + 4, gy - 30, segW - 8, 28);
        ctx.beginPath(); ctx.moveTo(sx + 4, gy - 2); ctx.lineTo(sx + segW - 4, gy - 30); ctx.stroke();

    if (style === 'leaf') {

        ctx.strokeStyle = col('#6a7a5a'); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(lx, gy); ctx.quadraticCurveTo(lx - 8, gy - 20, lx + sway, gy - 34); ctx.stroke();
        ctx.save(); ctx.translate(lx + sway, gy - 40); ctx.rotate((k ? 0.35 : -0.35) + sway * 0.02);
        if (damaged && k === 0) ctx.rotate(1.1);
        const g = ctx.createLinearGradient(0, -14, 0, 14); g.addColorStop(0, col('#4a7ac0')); g.addColorStop(1, col('#1f3a66'));
        ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 22, 12, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = col('#e8c25a'); ctx.lineWidth = 1.5; ctx.stroke();
        ctx.strokeStyle = col('#9cc0ea', 0.6); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0);
        for (let v = -12; v <= 12; v += 6) { ctx.moveTo(v, 0); ctx.lineTo(v + 5, -9); ctx.moveTo(v, 0); ctx.lineTo(v + 5, 9); } ctx.stroke();
        ctx.restore();
      }
    } else if (style === 'pergola') {
      ctx.fillStyle = col('#8a6440'); ctx.fillRect(sx + 3, gy - 46, 5, 46); ctx.fillRect(sx + segW - 8, gy - 46, 5, 46);
      ctx.fillStyle = col('#7a5638'); ctx.fillRect(sx, gy - 50, segW, 5);
      if (!(damaged && i === 2)) panelQuad(sx + 2, sx + segW - 2, gy - 48, gy - 72, 3, i * 50 + r * 30);
      // vines
      ctx.fillStyle = col('#5f9a44'); for (let v = 0; v < 4; v++) { circle(ctx, sx + 8 + v * (segW / 4), gy - 44 + Math.sin(v + i) * 3, 4); ctx.fill(); }
      if (S.warmth > 0.4) { ctx.fillStyle = col('#c45aa0'); circle(ctx, sx + segW * 0.5, gy - 40, 2.2); ctx.fill(); }
    } else {
      ctx.fillStyle = col('#8a929c'); ctx.fillRect(sx + 6, gy - 16, 3, 16); ctx.fillRect(sx + segW - 9, gy - 16, 3, 16);
      if (damaged && (i === 1 || i === 3)) {
        ctx.save(); ctx.translate(sx + segW / 2, gy - 18); ctx.rotate(0.4); panelQuad(-segW / 2 + 4, segW / 2 - 4, 6, -16, 3, 0); ctx.restore();
      } else panelQuad(sx + 1, sx + segW - 1, gy - 12, gy - 38, 4, i * 50 + r * 30);

// ----- dialogue -----
function startDialog(steps, who) {
  if (!steps || !steps.length) return;
  UI.dialog = { queue: steps.slice(), who, cur: null };
  $('#dialog').hidden = false;
  if (who && NPCS[who]) { const n = NPCS[who]; n.facing = S.player.x < n.x ? -1 : 1; S.player.facing = n.x > S.player.x ? 1 : -1; }
  advanceDialog();
}
function advanceDialog() {
  const d = UI.dialog;
  if (!d) return;
  if (d.cur && d.cur.choices) return; // must choose
  for (;;) {
    const s = d.queue.shift();
    if (!s) { endDialog(); return; }
    if (s.fx) { s.fx(); continue; }
    d.cur = s;
    renderDialogStep(s);
    return;
  }
}
function renderDialogStep(s) {
  const box = $('#dialog');
  const pc = $('#dlg-portrait');
  const nm = $('#dlg-name'), tx = $('#dlg-text'), ch = $('#dlg-choices');
  ch.innerHTML = '';
  if (s.choices) {
    const last = UI.dialog.lastSpeaker || UI.dialog.who;
    nm.textContent = S.player.name;
    nm.style.color = '#f2b955';
    pc.hidden = false;
    tx.textContent = '';
    pc.dataset.who = 'you'; drawPortrait(pc, 'you', 'happy');
    box.classList.add('choosing');
    s.choices.forEach((c, i) => {
      const b = el('button', { class: 'choice' }, `<kbd>${i + 1}</kbd> ${escapeHtml(fill(c.t))}`);
      b.onclick = () => choose(i);
      ch.appendChild(b);
    });
    return;
  }
  box.classList.remove('choosing');
  UI.dialog.lastSpeaker = s.s;
  nm.textContent = nameOf(s.s);
  nm.style.color = RES[s.s] ? RES[s.s].color : s.s === 'bolt' ? '#8ff4ff' : '#f2b955';
  tx.textContent = fill(s.t);
  pc.dataset.who = s.s;
  pc.hidden = s.s === 'narr';
  box.classList.toggle('narr', s.s === 'narr');
  if (s.s !== 'narr') drawPortrait(pc, s.s, s.mood);
  ch.innerHTML = '<span class="hint">Click or press E to continue</span>';
}
function choose(i) {
  const d = UI.dialog;
  if (!d || !d.cur || !d.cur.choices) return;
  const c = d.cur.choices[i];
  if (!c) return;
  hooks.sfx('click');
  const menu = d.cur;
  d.cur = null;
  const extra = [];
  extra.push(L('you', c.t, 'happy'));
  if (c.fx) extra.push(FX(c.fx));
  if (c.then) extra.push(...c.then);
  if (c.again && d.who && RES[d.who]) extra.push(menuStep(d.who));
  d.queue.unshift(...extra);
  advanceDialog();
}

}

function spark(values, w = 120, h = 30, color = '#f2b955') {
  if (values.length < 2) values = [values[0] || 0, values[0] || 0];
  const max = Math.max(1, ...values), min = 0;
  const pts = values.map((v, i) => [i / (values.length - 1) * (w - 6) + 3, h - 4 - (v - min) / (max - min) * (h - 8)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d} L ${last[0]} ${h - 2} L 3 ${h - 2} Z" fill="${color}22"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}
function pie(owners, size = 76) {
  let a = -Math.PI / 2;
  const r = size / 2 - 2, cx = size / 2, cy = size / 2;
  let paths = '';
  const entries = Object.entries(owners || {}).filter(([, v]) => v > 0.001);
  if (entries.length === 1) return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${OWNER_COLORS[entries[0][0]]}"/></svg>`;
  for (const [k, v] of entries) {
    const a2 = a + v * TAU;
    const large = v > 0.5 ? 1 : 0;
    paths += `<path d="M${cx} ${cy} L${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r} A${r} ${r} 0 ${large} 1 ${cx + Math.cos(a2) * r} ${cy + Math.sin(a2) * r} Z" fill="${OWNER_COLORS[k]}" stroke="#182428" stroke-width="1.5"/>`;
    a = a2;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">${paths}</svg>`;
}
function ownerLegend(owners) {
  return '<ul class="legend">' + Object.entries(owners || {}).filter(([, v]) => v > 0.001).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<li><i style="background:${OWNER_COLORS[k]}"></i>${OWNER_NAMES[k]} <b>${Math.round(v * 100)}%</b></li>`).join('') + '</ul>';
}

function meetingQuotes(pid, option) {
  const q = [];
  if (option === 'equal') q.push(['mara', 'Equal shares. Same for everyone. I like simple.'], ['teo', 'Twenty percent to the commons? Good. Things break. Somebody has to pay for fixing them.']);
  if (option === 'need') q.push(['juno', 'Bigger shares for whoever is still short? That’s... really kind. And smart, honestly.'], ['odile', 'I’d get less. I’m also the one who needs it least. Fine. Write it down before I change my mind.']);
  if (option === 'odile') q.push(['odile', 'Half the parts, half the shares. That’s a fair return on my savings.'], ['juno', 'So Odile gets half of everything it earns, forever? I mean... it is her money.']);
  if (option === 'brightline') q.push(['teo', 'Free is never free. They’ll keep the money and we’ll keep the bills.'], ['mara', 'A quarter off my power bill, today, for nothing? I can’t pretend that’s not tempting.']);
  if (pid === 'workshop' && option === 'brightline') { q.length = 0; q.push(['teo', 'I teach the robots, and the parts they make go to the city? Most of them, anyway.'], ['mara', 'They’d build it tomorrow, though. And we have no parts.']); }
  if (pid === 'compute') {
    q.length = 0;
    if (option === 'brightline') q.push(['juno', 'So I’d still be labeling for someone else’s machines. In our own depot. On our own sunlight.'], ['odile', 'At least it costs us nothing. Today.']);
    else if (option === 'odile') q.push(['odile', 'Machines that think, earning while I sleep. I’ll put in half.'], ['juno', 'Then half of what our machines think is Odile’s. Weird sentence.']);
    else q.push(['juno', 'The company I label for owns racks like these in the city. These would be ours.'], ['teo', 'If it runs on our array, the power is almost free. If Brightline owns the array, it isn’t.']);
  }
  return q;
}
function decideProject(pid, option, approach) {
  const d = PROJECTS[pid], p = S.projects[pid];
  const cp = communityPartsFor(pid, option), pl = pledgesFor(pid, option);
  const need = Math.max(0, cp - pl);
  if (!affordable(need).ok) return;
  spendParts(need);
  p.option = option; p.owners = ownersFor(option); p.approach = approach;
  p.status = 'building'; p.buildLeft = APPROACHES[approach].nights; p.buildTotal = p.buildLeft;
  if (approach === 'together') { for (const id of RES_IDS) befriend(id, 8); addStory(p, `Built by the neighbors after their shifts, with the robots holding the ladders.`); }
  else addStory(p, 'Built overnight by the robots.');
  addStory(p, `Owned by: ${Object.entries(p.owners).filter(([, v]) => v > 0).map(([k, v]) => `${OWNER_NAMES[k]} ${Math.round(v * 100)}%`).join(', ')}.`);
  logEvent(`The street chose "${OWNERSHIP[option].name}" for the ${d.name}.`, 'decision');
  if (pl) logEvent('Neighbors pledged 20 parts: Teo’s old tools, Mara’s shelving, Juno’s bike frame.', 'note');
  setQuest('wait_' + pid);

  hooks.sfx('build');

  closePanel();
  saveGame();
}

function previewCreation(canvas, cid, sel) {
  const L = LOTS[CREATIONS[cid].lot];
  const pc = canvas.getContext('2d');
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 360, h = canvas.clientHeight || 220;
  canvas.width = w * d; canvas.height = h * d;
  const fake = { status: 'built', style: sel.style, features: sel.features, stories: [] };
  const saved = ctx, savedC = S.creations[cid], savedG = GRADE;
  ctx = pc; S.creations[cid] = fake; GRADE = 20;
  try {
    const cx = L.x + L.w / 2, cy = L.y + L.d / 2 - 20;
    const sc = Math.min(w / (L.w + 120), h / (L.d + 170)) * d;
    pc.setTransform(sc, 0, 0, sc, w * d / 2 - cx * sc, h * d / 2 - cy * sc);
    pc.fillStyle = '#86b85c'; pc.fillRect(L.x - 200, L.y - 300, L.w + 400, L.d + 500);
    if (cid === 'kitchen') { drawLotsGround(); drawKitchenBack(fake); if (fake.features.includes('table')) drawKitchenTable(fake); if (fake.features.includes('herbs')) drawHerbs(fake); }
    if (cid === 'garden') drawGarden(fake);
    if (cid === 'pavilion') drawPavilion(fake);
  } finally { ctx = saved; S.creations[cid] = savedC; GRADE = savedG; LIGHTS.length = 0; }
}
function startCreation(cid, style, features, approach, cost) {
  const c = S.creations[cid], C = CREATIONS[cid];

  spendParts(cost);
  Object.assign(c, { status: 'building', style, features, approach, buildLeft: APPROACHES[approach].nights });
  c.buildTotal = c.buildLeft;
  const styleName = STYLES.find(s => s.id === style).name;
  addStory(c, `Built in the ${styleName.toLowerCase()} style.`);
  for (const f of features) {
    const F = C.features.find(x => x.id === f);
    if (approach === 'hand' && F.who) addStory(c, { oven: 'Teo and Mara laid every brick of the bread oven by hand.', table: 'Odile sanded the long table herself and carved the date under it.', herbs: 'Teo planted the herbs and a lemon tree from a cutting of his own.', mural: 'Juno painted the mural over three evenings. Everyone on the street is in it.', bench: 'Juno shaped the sketching bench from a fallen olive branch.', meadow: 'Teo scattered the wildflower seed by hand.', stage: 'Odile built the little stage with the robots and insisted it be exactly knee-high.', racks: 'Teo welded the bike racks from old rail scrap.' }[f] || `${RES[F.who].short} made the ${F.name.toLowerCase()} by hand.`);
  }
  for (const id of RES_IDS) befriend(id, approach === 'robots' ? 2 : approach === 'assist' ? 6 : 9);
  if (approach !== 'robots') for (const id of RES_IDS) if (H(id).stage === 'thriving') H(id).energy = clamp(H(id).energy + 6, 0, 100);

  toast(`The ${C.name} is underway.`, 'good');
  closePanel(); saveGame();
}

// ===== 10_main.js =====
// ---------- loop, input, saving, start screens ----------
const SAVE_KEY = 'afterlight-save-v1';
const SPEEDS = { 1: 2, 2: 6, 3: 16 }; // game minutes per real second
const keys = new Set();
let lastT = 0, saveT = 0, demo = true, booted = false;

// ----- sound: soft synthesized chimes and an ambient music box -----
const Audio2 = {
  ac: null, master: null, on: true, nextNote: 0,
  init() {
    if (this.ac) return;
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ac.createGain(); this.master.gain.value = 0.16; this.master.connect(this.ac.destination); } catch (e) { this.ac = null; }
  },
  enable(v) { this.on = v; if (v) { this.init(); if (this.ac && this.ac.state === 'suspended') this.ac.resume(); } },
  note(f, when, dur, type = 'triangle', vol = 0.25) {
    if (!this.ac || !this.on) return;
    const t = this.ac.currentTime + (when || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  sfx(name) {
    if (!this.ac || !this.on) return;
    const N = n => 261.63 * Math.pow(2, n / 12);
    if (name === 'click') this.note(N(19), 0, 0.12, 'sine', 0.08);
    if (name === 'quest') { this.note(N(12), 0, 0.5); this.note(N(16), 0.1, 0.5); this.note(N(19), 0.2, 0.8); }
    if (name === 'coin') { this.note(N(24), 0, 0.3, 'sine', 0.15); this.note(N(28), 0.08, 0.4, 'sine', 0.15); }
    if (name === 'build') { this.note(N(7), 0, 0.3, 'square', 0.05); this.note(N(12), 0.12, 0.5, 'triangle', 0.2); }
    if (name === 'chime') [0, 4, 7, 12, 16].forEach((n, i) => this.note(N(n + 12), i * 0.12, 1.2, 'sine', 0.15));
    if (name === 'afterlight') [0, 4, 7, 11, 14, 19, 24].forEach((n, i) => this.note(N(n), i * 0.22, 2.4, 'sine', 0.18));
  },
  music(dt) {
    if (!this.ac || !this.on || demo) return;
    this.nextNote -= dt;
    if (this.nextNote > 0) return;
    const w = S.warmth, m = S.minute % 1440, night = m < 6 * 60 || m > 21 * 60;
    this.nextNote = (night ? 2.4 : 1.1) + Math.random() * (2.4 - w * 1.4);
    const scale = w > 0.5 ? [0, 2, 4, 7, 9, 12, 14, 16, 19] : [0, 3, 5, 7, 10, 12];
    const n = scale[(Math.random() * scale.length) | 0] + (Math.random() < 0.3 ? 12 : 0);
    this.note(261.63 * Math.pow(2, n / 12), 0, 2.2, 'sine', (night ? 0.05 : 0.08) * (0.6 + w * 0.6));
    if (Math.random() < 0.25) this.note(130.81 * Math.pow(2, scale[(Math.random() * 3) | 0] / 12), 0, 3.5, 'triangle', 0.05);
  },
};

// ----- saving -----
function saveGame() {
  if (demo || !S) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: play continues */ }
}
function readSave() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
function hydrate(data) {
  const base = newState({ name: data.player.name, look: data.player.look, botName: data.bot.name, botColor: data.bot.color });
  for (const k in data) {
    if (k === 'households' || k === 'projects' || k === 'creations') { for (const id in data[k]) base[k][id] = Object.assign(base[k][id] || {}, data[k][id]); }
    else base[k] = data[k];
  }
  S = base;
  return S;
}

// ----- the player -----
function updatePlayer(dt) {
  const P = S.player;
  if (UI.dialog || UI.panel || UI.cutscene) { P.moving = false; return; }
  let vx = 0, vy = 0;
  if (keys.has('arrowleft') || keys.has('a')) vx -= 1;
  if (keys.has('arrowright') || keys.has('d')) vx += 1;
  if (keys.has('arrowup') || keys.has('w')) vy -= 1;
  if (keys.has('arrowdown') || keys.has('s')) vy += 1;
  const speed = 160;
  if (vx || vy) { P.path = null; P.goal = null; }
  else if (P.path && P.path.length) {
    if (P.goal && P.goal.type === 'npc') {
      const n = NPCS[P.goal.id];
      P.repath = (P.repath || 0) - dt;
      if (n.visible && P.repath <= 0) { P.repath = 0.4; P.path = findPath(P.x, P.y, n.x, n.y + 10); }
    }
    const t = P.path[0];
    const dx = t.x - P.x, dy = t.y - P.y, d = Math.hypot(dx, dy);
    if (d < 4) P.path.shift();
    else { vx = dx / d; vy = dy / d; }
  }
  const len = Math.hypot(vx, vy);
  P.moving = len > 0;
  if (P.moving) {
    vx /= len; vy /= len;
    const nx = P.x + vx * speed * dt, ny = P.y + vy * speed * dt;
    let moved = false;
    if (footFree(nx, P.y)) { P.x = nx; moved = true; }
    if (footFree(P.x, ny)) { P.y = ny; moved = true; }
    if (!moved && P.path) P.path.shift();
    if (Math.abs(vx) > 0.2) P.facing = vx > 0 ? 1 : -1;
    P.dirY = vy;
    P.phase = (P.phase || 0) + dt * 11;
  }
  // arrive at a clicked target
  if (P.goal) {
    const g = P.goal;
    const gp = g.type === 'npc' ? NPCS[g.id] : g;
    if (g.type === 'npc' && !NPCS[g.id].visible) P.goal = null;
    else if (dist(P.x, P.y, gp.x, gp.y) < 52) { P.path = null; P.goal = null; P.moving = false; interact(findInteractable(g)); }
    else if (!P.path || !P.path.length) P.goal = null;
  }
  // camera follows
  const k = Math.min(1, dt * 4);
  cam.x += (P.x - cam.x) * k; cam.y += (P.y - 40 - cam.y) * k;
}
function updateBot(dt) {
  const B = S.bot, P = S.player;
  const tx = P.x - (P.facing || 1) * 34, ty = P.y + 8;
  const d = dist(B.x, B.y, tx, ty);
  if (d > 600) { B.x = tx; B.y = ty; }
  const k = Math.min(1, dt * (d > 80 ? 3.5 : 2));
  if (d > 6) { B.facing = tx > B.x ? 1 : -1; B.x += (tx - B.x) * k; B.y += (ty - B.y) * k; }
  if (BOT_FX.sayT > 0) BOT_FX.sayT -= dt;
}

// ----- things you can interact with -----
function interactables() {

  out.push({ type: 'workbench', x: POI.workbench.x, y: POI.workbench.y, label: 'Use your workbench', pri: 2 });

      if (cid === 'kitchen' && S.quest === 'breakfast' && breakfastHours()) out.push({ type: 'breakfast', x: POI.kitchenTable.x, y: POI.kitchenTable.y + 40, label: 'Start the first breakfast', pri: 4 });
      else out.push({ type: 'creation', cid, x: p.x, y: p.y, label: c.status === 'available' ? `Plan the ${CREATIONS[cid].name}` : `Visit the ${CREATIONS[cid].name}`, pri: 1 });
    }
  }

    const n = NPCS[id], b = currentBlock(id);
    if (!n.visible && b.hidden && b.act !== 'away') { const d = BUILDINGS[RES[id].home].door; out.push({ type: 'door', id, x: d.x, y: d.y + 18, label: `Knock on ${H(id).met ? RES[id].short + '’s' : 'the'} door`, pri: 1 }); }
  }
  out.push({ type: 'flavor', x: 2250, y: 1000, label: 'Read the sign', text: 'Riverside, 3 km. Another town, another street of tired people. Someday this bridge will carry more than bicycles.', pri: 0 });
  out.push({ type: 'flavor', x: 1200, y: 1590, label: 'Look at the timetable', text: S.warmth < 0.4 ? 'The 6:45 is always full. People sleep standing up.' : 'Someone has drawn a little sun on the timetable. The 6:45 has seats now.', pri: 0 });
  out.push({ type: 'bot', x: S.bot.x, y: S.bot.y, label: `Ask ${S.bot.name} for a hint`, pri: -1 });
  return out;
}
function siteSpot(pid) {
  if (pid === 'solar') return POI.sunfield;
  if (pid === 'workshop') return { x: 1725, y: 1004 };
  if (pid === 'compute') return { x: 175, y: 1150 };
  return { x: 960, y: 1392 };
}
function breakfastHours() { const h = (S.minute % 1440) / 60; return h >= 6 && h < 11.5; }
function findInteractable(g) {
  const list = interactables();
  return list.find(i => i.type === g.type && (i.id || i.key || i.pid || i.cid) === (g.id || g.key || g.pid || g.cid)) || null;
}
function nearestInteractable() {
  const P = S.player;
  let best = null, bs = Infinity;
  for (const it of interactables()) {
    const d = dist(P.x, P.y, it.x, it.y);
    const r = it.type === 'bot' ? 0 : 50;
    if (d < r) { const score = d - it.pri * 12; if (score < bs) { bs = score; best = it; } }
  }
  return best;
}
function interact(it) {
  it = it || UI.nearby;
  if (!it || UI.dialog || UI.panel || UI.cutscene) return;
  hooks.sfx('click');
  if (it.type === 'npc') { startDialog(talkTo(it.id), it.id); return; }
  if (it.type === 'bot') { startDialog(talkBolt(), null); return; }
  if (it.type === 'workbench') { openPanel('workbench'); return; }
  if (it.type === 'notice') {

  }

  if (it.type === 'creation') { openPanel('creation', it.cid); return; }
  if (it.type === 'breakfast') { startBreakfast(); return; }
  if (it.type === 'door') {
    const r = knockDoor(it.id);
    if (r === 'asleep') startDialog([L('narr', 'No answer. The lights are off. Let them sleep.', null)], null);
    else if (r === 'ok') { boltSay('Knock knock!', 2); setTimeout(() => { if (!UI.dialog && !UI.panel) startDialog(talkTo(it.id), it.id); }, 500); }
    return;
  }

}
function noticeText() {
  if (S.flags.breakfastDone) return 'In Odile’s handwriting, in ink: SUNDAY BREAKFAST, TERRACE, EVERYONE. Below it, Pip has drawn a jam jar.';
  if (online('solar')) return 'Ownership records for everything the street has built are pinned here, along with a lost-cat poster and a recipe for cardamom bread.';

}
function doSalvage(key) {

  S.salvage[key] = true;
  S.parts += sv.parts;

// ----- time -----
function nextMorning() {
  if (UI.dialog || UI.panel || UI.cutscene || demo) return;
  const fade = $('#fade');
  fade.classList.add('on');
  setTimeout(() => {
    if (S.minute % 1440 >= 360) endOfDay();
    S.minute = 360;
    afterNewDay(true);
    S.player.x = 1520; S.player.y = 1022; S.player.path = null; S.player.goal = null;
    S.bot.x = 1490; S.bot.y = 1030;
    cam.x = S.player.x; cam.y = S.player.y;
    fade.classList.remove('on');
    openPanel('morning');
    S.pendingMorning = false;
    saveGame();
  }, 420);
}
function afterNewDay(skip) {
  rebuildSchedules();
  if (skip) placeAllNPCs();
  rebuildColliders(S);
  FERRY_PATH = null;
}
function advanceTime(dt) {
  if (S.paused || UI.dialog || UI.panel || UI.cutscene) return 0;
  const gmps = SPEEDS[S.speed] || 2;
  const prev = S.minute;
  S.minute += gmps * dt;
  if (S.minute >= 1440) { S.minute -= 1440; endOfDay(); afterNewDay(false); S.pendingMorning = true; }
  if (S.pendingMorning && S.minute >= 360) { S.pendingMorning = false; openPanel('morning'); }
  if (Math.floor(prev / 30) !== Math.floor(S.minute / 30)) { updateWarmthTarget(); saveGame(); }
  S.warmth += (S.warmthTarget - S.warmth) * Math.min(1, gmps * dt * 0.004);
  if (Math.floor(prev / 60) !== Math.floor(S.minute / 60) && Math.floor(S.minute / 60) === 23) boltSay('It’s getting late. Press Next morning whenever you’re ready to sleep.', 6);
  return gmps;
}

// ----- input -----
function setupInput() {
  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    const k = e.key.toLowerCase();
    if (demo) return;
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    keys.add(k);
    if (UI.cutscene) { if (k === 'enter' || k === ' ' || k === 'e') { const b = $('#cs-go'); if (b) b.click(); } return; }
    if (UI.dialog) {
      if (k === 'e' || k === ' ' || k === 'enter') advanceDialog();
      if (/^[1-4]$/.test(k)) choose(+k - 1);
      return;
    }
    if (k === 'escape') { if (UI.panel) closePanel(); else openPanel('menu'); return; }
    if (UI.panel) { if (k === 'l' && UI.panel.kind === 'ledger' || k === 'n' && UI.panel.kind === 'notebook' || k === 'b' && UI.panel.kind === 'projects') closePanel(); return; }
    if (k === 'e' || k === ' ' || k === 'enter') interact();
    if (k === 'l') openPanel('ledger');
    if (k === 'n') openPanel('notebook');
    if (k === 'b') openPanel('projects');
    if (k === 'p') setSpeed(0);
    if (k === '1' || k === '2' || k === '3') setSpeed(+k);
    if (k === 'z') nextMorning();
    if (k === '+' || k === '=') cam.userZoom = clamp(cam.userZoom * 1.12, 0.7, 2.2);
    if (k === '-') cam.userZoom = clamp(cam.userZoom / 1.12, 0.7, 2.2);
  });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());
  cvs.addEventListener('pointerdown', e => {
    Audio2.enable(S.sound !== false);
    if (demo || UI.dialog || UI.panel || UI.cutscene) { if (UI.dialog) advanceDialog(); return; }
    const r = cvs.getBoundingClientRect();
    const w = screenToWorld(e.clientX - r.left, e.clientY - r.top);
    clickWorld(w.x, w.y);
  });
  cvs.addEventListener('wheel', e => { e.preventDefault(); cam.userZoom = clamp(cam.userZoom * (e.deltaY > 0 ? 0.9 : 1.1), 0.7, 2.2); }, { passive: false });
  window.addEventListener('resize', resize);
}
function clickWorld(x, y) {
  const P = S.player;
  let hit = null, hd = Infinity;
  for (const it of interactables()) {
    if (it.type === 'bot') { if (dist(x, y, it.x, it.y - 18) < 20) { hit = it; break; } continue; }
    const yy = it.type === 'npc' ? it.y - 22 : it.y - 10;
    const d = dist(x, y, it.x, yy);
    if (d < (it.type === 'npc' ? 30 : 40) && d < hd) { hd = d; hit = it; }
  }
  if (hit) {
    if (dist(P.x, P.y, hit.x, hit.y) < 52) { interact(hit); return; }
    P.goal = { type: hit.type, id: hit.id, key: hit.key, pid: hit.pid, cid: hit.cid, x: hit.x, y: hit.y };
    P.path = findPath(P.x, P.y, hit.x, hit.y + (hit.type === 'npc' ? 12 : 8));
    return;
  }
  P.goal = null;
  P.path = findPath(P.x, P.y, x, y);
  spawn('spark', x, y, { life: 0.4 });
}

// ----- main loop -----
// If the device can't keep up, drop the purely decorative effects (tilt-shift blur,
// ink outlines on people) once, for good, so the town never stutters.
const FX_WATCH = { t: 0, n: 0, sum: 0 };
function watchFrameRate(dt) {
  if (LOW_FX) return;
  FX_WATCH.t += dt;
  if (FX_WATCH.t < 2) return; // let fonts and art settle first
  FX_WATCH.n++; FX_WATCH.sum += dt;
  if (FX_WATCH.n < 90) return;
  if (FX_WATCH.sum / FX_WATCH.n > 1 / 40) { LOW_FX = true; document.body.classList.add('lowfx'); }
  FX_WATCH.n = 0; FX_WATCH.sum = 0;
}
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  watchFrameRate(dt);
  if (demo) {
    S.minute = 17 * 60 + 40 + Math.sin(t / 9000) * 20;
    cam.x = 1150 + Math.sin(t / 14000) * 300; cam.y = 900 + Math.cos(t / 17000) * 140;
    updateNPCs(dt, 2);
  } else {
    const gmps = advanceTime(dt);
    updatePlayer(dt);
    updateBot(dt);
    updateNPCs(dt, gmps);
    // passers-by say things
    for (const id of RES_IDS) {
      const n = NPCS[id];
      if (n.visible && !n.bubble && n.barkCD <= 0 && !UI.dialog && dist(n.x, n.y, S.player.x, S.player.y) < 120 && Math.random() < 0.02) { n.bubble = { text: barkFor(id), t: 3.4 }; n.barkCD = 16 + Math.random() * 14; }
    }
    UI.nearby = nearestInteractable();
    // a gentle nudge if you seem stuck
    const o = objectives()[0];
    const ot = o ? o.text : '';
    if (ot !== UI.lastObj) { UI.lastObj = ot; UI.objT = 0; } else if (!UI.dialog && !UI.panel) { UI.objT += dt; if (UI.objT > 75 && o) { UI.objT = 0; boltSay(o.text + '.', 5); } }
    Audio2.music(dt);
    updateHUD();
  }
  updateWorkers();
  render(dt);
  requestAnimationFrame(frame);
}

// ----- start screens -----
const LOOK_OPTS = {
  skin: ['#f3d2bd', '#e9bf9b', '#c99572', '#a8714d', '#7b4a32', '#4e2f22'],
  hairStyle: ['short', 'long', 'bob', 'curly', 'bun', 'ponytail', 'buzz'],
  hair: ['#1b1a22', '#4a2e1e', '#8a5a32', '#d9a85a', '#b8402e', '#c8c2ba'],
  outfit: ['#4fa38a', '#e0874a', '#6f8fd0', '#c45a6a', '#e8c25a', '#8a6ab8', '#5f7f4b', '#f2efe6'],
  pants: ['#3e4250', '#5a4a3a', '#2f4a5a', '#6a5a4a'],
  bot: ['#7fd0c8', '#f2b955', '#e8805a', '#a8b8e8', '#9cc46a'],
};
const HAIR_NAMES = { short: 'Short', long: 'Long', bob: 'Bob', curly: 'Curls', bun: 'Bun', ponytail: 'Ponytail', buzz: 'Buzz' };
function showTitle() {
  const save = readSave();
  const ov = $('#title');
  ov.hidden = false;
  ov.innerHTML = `<div class="title-card">
    <p class="eyebrow">A neighborhood life sim</p>
    <h1>Afterlight</h1>
    <p class="sub">A tired little town. Four neighbors who never have time. One workshop, one helpful robot, and a chance to build a future where everyone has enough, and then some.</p>
    <div class="row">${save ? `<button class="btn primary" id="t-continue">Continue · day ${save.day}</button><button class="btn" id="t-new">New game</button>` : '<button class="btn primary" id="t-new">Begin</button>'}</div>
    <p class="fine">Saves automatically in this browser. Works with keyboard, mouse, or touch.</p></div>`;
  if (save) $('#t-continue').onclick = () => { Audio2.enable(save.sound !== false); hydrate(save); startGame(false); };
  $('#t-new').onclick = () => { Audio2.enable(true); showCreator(); };
}
function showCreator() {
  const sel = { name: '', skin: LOOK_OPTS.skin[2], hairStyle: 'short', hair: LOOK_OPTS.hair[1], outfit: LOOK_OPTS.outfit[0], pants: LOOK_OPTS.pants[0], botName: 'Pim', bot: LOOK_OPTS.bot[0] };
  const ov = $('#title');
  const sw = (key, vals) => `<div class="sw" data-key="${key}">${vals.map(v => `<button class="swatch${sel[key] === v ? ' on' : ''}" data-v="${v}" style="background:${v}" aria-label="${v}"></button>`).join('')}</div>`;
  const draw = () => {
    const c = $('#cc-preview'); if (!c) return;
    const g = c.getContext('2d'); const d = Math.min(window.devicePixelRatio || 1, 2);
    c.width = 220 * d; c.height = 240 * d; g.setTransform(d, 0, 0, d, 0, 0);
    const bg = g.createRadialGradient(110, 150, 10, 110, 150, 140); bg.addColorStop(0, '#f6dca8'); bg.addColorStop(1, '#e7b77a');
    g.fillStyle = bg; g.fillRect(0, 0, 220, 240);
    g.fillStyle = '#9cc46a'; g.beginPath(); g.ellipse(110, 214, 120, 34, 0, 0, TAU); g.fill();
    const sv = GRADE; GRADE = 20;
    drawPerson(g, 92, 212, { skin: sel.skin, hair: sel.hair, hairStyle: sel.hairStyle, outfit: sel.outfit, pants: sel.pants }, { scale: 3.1, mood: 'happy', facing: 1 });
    drawBot(g, 182, 206, sel.bot, { t: performance.now() / 1000, facing: -1 });
    GRADE = sv;
  };
  ov.innerHTML = `<div class="title-card creator">
    <h2>Who arrives on the evening bus?</h2>
    <div class="cc-grid">
      <canvas id="cc-preview" width="220" height="240" aria-label="Character preview"></canvas>
      <div class="cc-fields">
        <label for="cc-name">Your name</label><input id="cc-name" maxlength="16" placeholder="Type a name" autocomplete="off">
        <label>Skin</label>${sw('skin', LOOK_OPTS.skin)}
        <label>Hair</label><div class="chips" data-key="hairStyle">${LOOK_OPTS.hairStyle.map(h => `<button class="chipbtn${sel.hairStyle === h ? ' on' : ''}" data-v="${h}">${HAIR_NAMES[h]}</button>`).join('')}</div>
        ${sw('hair', LOOK_OPTS.hair)}
        <label>Clothes</label>${sw('outfit', LOOK_OPTS.outfit)}
        <label for="cc-bot">Your robot</label><input id="cc-bot" maxlength="12" value="Pim" autocomplete="off">
        ${sw('bot', LOOK_OPTS.bot)}
      </div>
    </div>
    <div class="row"><button class="btn" id="cc-rand">Surprise me</button><button class="btn primary" id="cc-go">Step off the bus</button></div></div>`;
  ov.querySelectorAll('.sw, .chips').forEach(group => group.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    sel[group.dataset.key] = b.dataset.v;
    group.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    draw();
  }));
  $('#cc-rand').onclick = () => {
    for (const k of ['skin', 'hairStyle', 'hair', 'outfit', 'bot']) sel[k] = pick(LOOK_OPTS[k === 'bot' ? 'bot' : k]);
    ov.querySelectorAll('.sw, .chips').forEach(group => group.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === sel[group.dataset.key])));
    if (!$('#cc-name').value) $('#cc-name').value = pick(['Ren', 'Sol', 'Ava', 'Ines', 'Kofi', 'Lio', 'Maya', 'Tomas', 'Noor', 'Ezra']);
    draw();
  };
  $('#cc-go').onclick = () => {
    const name = ($('#cc-name').value || '').trim() || 'Ren';
    const botName = ($('#cc-bot').value || '').trim() || 'Pim';
    wipeSave();
    newState({ name, look: { skin: sel.skin, hair: sel.hair, hairStyle: sel.hairStyle, outfit: sel.outfit, pants: sel.pants }, botName, botColor: sel.bot });
    startGame(true);
  };
  draw();
  const anim = () => { if ($('#cc-preview')) { draw(); requestAnimationFrame(anim); } };
  requestAnimationFrame(anim);
}
function startGame(fresh) {
  demo = false;
  $('#title').hidden = true;
  $('#hud').hidden = false;
  rebuildColliders(S);
  initNPCs();
  FERRY_PATH = null;
  cam.x = S.player.x; cam.y = S.player.y;
  updateHUD(true);
  if (fresh) {
    logEvent(`${S.player.name} and ${S.bot.name} arrived on the evening bus.`, 'milestone');
    setTimeout(() => startDialog([
      L('narr', 'The evening bus wheezes away. The street is quiet in the way tired places are quiet.', null),
      L('bolt', 'Here we are, {name}! Your workshop is east of the plaza. And look: the neighbors are coming home from work.', 'happy'),
      L('bolt', 'They look exhausted. Let’s say hello. Walk with WASD or the arrow keys, or click where you want to go. Press E or tap someone to talk.', 'happy'),
    ], null), 500);
  }
  saveGame();
}

function boot() {
  setupCanvas($('#game'));
  buildScenery();
  buildGroundBits();
  newState({ name: 'Ren', look: { skin: '#c99572', hair: '#4a2e1e', hairStyle: 'short', outfit: '#4fa38a', pants: '#3e4250' }, botName: 'Pim', botColor: '#7fd0c8' });
  S.minute = 17 * 60 + 40;
  rebuildColliders(S);
  initArt();
  initNPCs();
  buildHUD();
  setupInput();
  hooks.toast = toast; hooks.bolt = (t) => boltSay(t, 6); hooks.sfx = n => Audio2.sfx(n); hooks.changed = () => updateHUD(true);
  booted = true;
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(() => ({ save: !demo && S ? JSON.stringify(S) : null })); } catch (e) { } }
  const start = (data) => {
    if (data && data.save) { try { hydrate(JSON.parse(data.save)); startGame(false); } catch (e) { showTitle(); } }
    else showTitle();
    requestAnimationFrame(t => { lastT = t; frame(t); });
  };
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
}

// test and debugging hooks
window.__AL = {
  get S() { return S; }, NPCS, UI, objectives, interact, interactables, talkTo, openPanel, closePanel, nextMorning, advanceDialog, choose,
  teleport(x, y) { const p = nearestWalkable(x, y); S.player.x = p.x; S.player.y = p.y; S.player.path = null; cam.x = p.x; cam.y = p.y; },
  near(type, id) { const it = interactables().find(i => i.type === type && (i.id === id || i.key === id || i.pid === id || i.cid === id || id === undefined)); if (it) this.teleport(it.x, it.y + 14); return it; },
  econ: () => RES_IDS.map(id => ({ id, work: H(id).work, req: round1(requiredWork(id)), exp: round1(expensesOf(id).total), inc: round1(incomeOf(id).total), energy: Math.round(H(id).energy), stage: H(id).stage })),
};
window.addEventListener('load', boot);

})();
