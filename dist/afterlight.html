<title>Afterlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: the world fills the screen; glass panels float at its edges and get out of the way. */
:root {
  --ink: #172226; --ink-2: #213238; --glass: rgba(19, 31, 35, 0.86); --line: rgba(251, 243, 228, 0.14);
  --text: #f8efe0; --muted: #b7c0b4; --amber: #f2b955; --coral: #e8805a; --leaf: #9cc46a; --sky: #8fd0e0; --plum: #c46a9a;
  --display: 'Caprasimo', Georgia, 'Times New Roman', serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 14px;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #24352c; color: var(--text); font-family: var(--body); -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
kbd { font-family: var(--body); font-weight: 800; font-size: 0.72em; background: rgba(251,243,228,0.14); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* miniature look: blur the top and bottom of the world like a tilt-shift lens (done by the compositor, not the canvas) */
#tiltshift { position: fixed; inset: 0; pointer-events: none; -webkit-backdrop-filter: blur(2.6px); backdrop-filter: blur(2.6px);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 25%, transparent 75%, #000 100%); mask-image: linear-gradient(to bottom, #000 0%, transparent 25%, transparent 75%, #000 100%); }
.lowfx #tiltshift { display: none; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 8px 28px rgba(8, 12, 16, 0.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* HUD */
#hud-tl { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); padding: 10px 12px; display: grid; gap: 8px; }
.time { display: flex; align-items: center; gap: 10px; }
.time img { width: 26px; height: 26px; }
.time b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.time span { font-size: 12px; color: var(--muted); font-weight: 700; }
.speeds { display: flex; gap: 4px; }
.speeds button, .ibtn { background: rgba(251,243,228,0.07); border: 1px solid var(--line); border-radius: 9px; min-width: 34px; height: 32px; padding: 0 8px; font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.speeds button.on { background: var(--amber); color: #2a1e10; border-color: transparent; }
.speeds svg, .ibtn svg { width: 16px; height: 16px; flex: none; }
#btn-morning { padding: 0 10px; }
#hud-tr { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; justify-items: end; }
.res { display: flex; align-items: center; gap: 14px; padding: 8px 12px; }
.chipres { display: flex; align-items: baseline; gap: 5px; font-variant-numeric: tabular-nums; }
.chipres b { font-size: 17px; font-weight: 800; }
.chipres span { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.chipres i { width: 14px; height: 14px; border-radius: 50%; align-self: center; }
.chipres i.gear { background: radial-gradient(circle, #5a4a3a 30%, var(--amber) 32%); }
.chipres i.coin { background: radial-gradient(circle at 35% 35%, #fff0b8, #e8b84a 60%, #b8862a); }
.warm { display: grid; gap: 2px; min-width: 110px; }
.warm span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }
.warm em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--amber); }
.bar { height: 6px; border-radius: 4px; background: rgba(251,243,228,0.12); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #8aa4b8, var(--amber), #ff9a6a); border-radius: 4px; transition: width 1s; }
.bar.wide { width: 220px; }
.btns { display: flex; gap: 6px; }
.btns .ibtn { height: 36px; padding: 0 12px; background: var(--glass); backdrop-filter: blur(6px); }
#objective { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100vw - 24px)); padding: 12px 14px; cursor: pointer; }
#objective::before { content: 'Next'; display: block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 800; color: var(--amber); margin-bottom: 2px; }
#obj-title { font-weight: 800; font-size: 15px; line-height: 1.25; }
#obj-detail { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; line-height: 1.4; }
#obj-side .side { font-size: 12px; color: var(--sky); margin-top: 6px; font-weight: 700; }
#prompt { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); padding: 9px 16px; border-radius: 999px; font-weight: 800; font-size: 14px; background: rgba(255, 246, 228, 0.95); color: #2d2633; box-shadow: 0 6px 20px rgba(0,0,0,0.3); cursor: pointer; white-space: nowrap; }
#prompt kbd { background: #2d2633; color: #fff6e4; border: 0; }
#arrow { position: fixed; left: 0; top: 0; width: 44px; height: 44px; pointer-events: none; }
#arrow::before { content: ''; position: absolute; inset: 8px; background: var(--amber); clip-path: polygon(100% 50%, 20% 10%, 38% 50%, 20% 90%); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }

/* toasts */
#toasts { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(460px, calc(100vw - 32px)); }
.toast { background: rgba(255, 246, 228, 0.96); color: #2d2633; padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); animation: tin 0.35s ease-out; text-align: center; transition: opacity 0.5s, transform 0.5s; }
.toast.good { border-left: 4px solid var(--leaf); }
.toast.story { border-left: 4px solid var(--plum); }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* dialogue */
#dialog { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(720px, calc(100vw - 24px)); display: flex; gap: 14px; padding: 14px 16px; z-index: 5; cursor: pointer; }
#dlg-portrait { width: 84px; height: 84px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 70%, #f6dca8, #d99a5e); }
#dialog.narr { font-style: italic; }
.dlg-main { min-width: 0; flex: 1; }
#dlg-name { font-family: var(--display); font-size: 19px; line-height: 1.1; }
#dlg-text { margin: 6px 0 8px; font-size: 16px; line-height: 1.5; max-width: 62ch; }
#dlg-choices { display: grid; gap: 6px; }
#dlg-choices .hint { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.choice { text-align: left; background: rgba(251,243,228,0.08); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 700; font-size: 14.5px; }
.choice:hover { background: rgba(242,185,85,0.2); border-color: var(--amber); }

/* panels */
#panel-wrap { position: fixed; inset: 0; background: rgba(10, 14, 18, 0.45); display: grid; place-items: center; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px)); }
#panel-wrap[hidden] { display: none; }
.panel { width: min(900px, 100%); max-height: 100%; overflow: auto; background: #182327; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.phead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; background: linear-gradient(#182327 80%, rgba(24,35,39,0)); }
.phead h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: 0.01em; text-wrap: balance; }
.close { background: rgba(251,243,228,0.08); border: 1px solid var(--line); width: 36px; height: 36px; border-radius: 50%; font-size: 22px; line-height: 1; }
.pbody { padding: 0 18px 18px; display: grid; gap: 14px; }
.pbody h4 { margin: 4px 0 0; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); }
.lede { margin: 0; font-size: 15px; line-height: 1.5; color: #ece3d2; max-width: 70ch; }
.fine { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-style: italic; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 13px; color: var(--muted); }
.tab.on { background: var(--text); color: #1b2428; border-color: transparent; }
.chip { display: inline-block; font-style: normal; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(251,243,228,0.1); color: var(--muted); letter-spacing: 0.02em; }
.chip.good { background: rgba(156,196,106,0.2); color: #c4e39a; }
.chip.mid { background: rgba(242,185,85,0.18); color: #f6cf85; }
.chip.bad { background: rgba(232,128,90,0.2); color: #f4a688; }
.chip.calm { background: rgba(143,208,224,0.18); color: #b4e2ee; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.good { color: #c4e39a; } .mid { color: #f6cf85; } .bad { color: #f4a688; }
.btn { background: rgba(251,243,228,0.08); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-weight: 800; font-size: 14px; }
.btn.primary { background: var(--amber); color: #2a1e10; border-color: transparent; }
.btn.danger { background: rgba(232,128,90,0.18); border-color: rgba(232,128,90,0.5); }
.btn.done { opacity: 0.7; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.pfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.pfoot .muted { margin-right: auto; font-size: 13px; }
.warn { color: #f4a688; font-size: 13px; font-weight: 700; }
.hh-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.hh { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.hh-top { display: flex; gap: 10px; align-items: center; }
.portrait { border-radius: 12px; background: radial-gradient(circle at 50% 70%, #f6dca8, #d99a5e); flex: none; }
.hh-name { display: grid; gap: 2px; min-width: 0; }
.hh-name span { font-size: 12px; color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { padding: 3px 0; vertical-align: top; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 800; padding-bottom: 6px; }
.bills s { color: var(--muted); font-size: 11.5px; }
.bills tr.tot td { border-top: 1px solid var(--line); font-weight: 800; padding-top: 5px; }
.bills tr.inc td { color: #c4e39a; font-weight: 800; }
.bills tr.sub td { color: var(--muted); font-size: 12px; }
.hh-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.hh-stats > div { display: grid; gap: 3px; align-content: start; }
.lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }
.big { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big small { font-size: 12px; color: var(--muted); font-weight: 700; }
.delta { font-size: 11.5px; color: #c4e39a; font-weight: 700; }
.pcard { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.pcard.dim { opacity: 0.75; }
.pcard.warn { border-color: rgba(232,128,90,0.6); }
.pcard p { margin: 0; line-height: 1.45; font-size: 14px; }
.pc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pc-head h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; }
.pc-body { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 14px; }
.pc-pie { display: flex; gap: 10px; align-items: center; }
.pc-nums { display: grid; gap: 6px; font-size: 13.5px; min-width: 0; }
.legend { list-style: none; margin: 0; padding: 0; font-size: 12px; display: grid; gap: 3px; }
.legend i, .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.stories { margin: 0; padding-left: 18px; font-size: 13px; color: #e6dccb; display: grid; gap: 3px; }
.ups { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.up { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.up p { margin: 2px 0 0; font-size: 13px; color: #ddd3c2; }
.up em { color: #c4e39a; font-style: normal; font-weight: 700; }
.idea { font-size: 11px; font-weight: 800; }
.specs { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #ddd3c2; }
.specs b { color: var(--amber); font-weight: 800; margin-right: 4px; }
.styles, .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.options.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.style, .option, .feat { text-align: left; background: rgba(251,243,228,0.05); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 3px; align-content: start; }
.style span, .option span, .feat span { font-size: 12.5px; color: #d6ccbb; line-height: 1.4; }
.style.on, .option.on, .feat.on { border-color: var(--amber); background: rgba(242,185,85,0.12); }
.option .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--amber); font-weight: 800; }
.option .cost { color: var(--sky); font-weight: 700; font-size: 12px; }
.option em { color: #f4a688; font-style: normal; }
.quotes { display: grid; gap: 6px; }
.q { font-size: 14px; background: rgba(251,243,228,0.05); border-radius: 10px; padding: 8px 12px; line-height: 1.45; }
.scroll-x { overflow-x: auto; }
.proj { min-width: 520px; }
.proj td { padding: 5px 4px; border-bottom: 1px solid rgba(251,243,228,0.06); }
.flow { display: grid; gap: 6px; }
.flow-l { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; font-size: 13.5px; }
.flow-l span { color: var(--muted); }
.flow-bar { display: flex; height: 18px; border-radius: 8px; overflow: hidden; gap: 2px; }
.flow-bar i { display: block; }
.recv td { padding: 5px 0; border-bottom: 1px solid rgba(251,243,228,0.06); }
.goals { display: grid; gap: 8px; }
.goal { background: var(--ink-2); border-radius: 12px; padding: 10px 12px; border-left: 4px solid var(--amber); }
.goal.side { border-left-color: var(--sky); }
.goal p { margin: 4px 0 0; color: #ddd3c2; font-size: 13.5px; line-height: 1.45; }
.done-list ul, .log { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; color: #d6ccbb; }
.log span { color: var(--amber); font-weight: 800; font-size: 11px; margin-right: 6px; }
.help p { font-size: 13.5px; line-height: 1.7; color: #ddd3c2; margin: 6px 0 0; }
.person { display: flex; gap: 12px; background: var(--ink-2); border-radius: 14px; padding: 12px; }
.person p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; }
.hearts { color: #e8607a; letter-spacing: 1px; font-size: 13px; }
.hearts span { color: rgba(251,243,228,0.18); }
.town .meter { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.events { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; line-height: 1.45; }
.creator-grid { display: grid; grid-template-columns: minmax(0, 360px) 1fr; gap: 14px; }
.creator-grid > div { min-width: 0; display: grid; gap: 8px; align-content: start; }
.preview { width: 100%; max-width: 360px; aspect-ratio: 360 / 220; border-radius: 12px; background: #86b85c; }
.feats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.options.three { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.menu { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.menu p { width: 100%; margin: 0; }

/* cutscenes + title */
#cutscene, #title { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; }
#cutscene[hidden], #title[hidden] { display: none; }
.cutscene.afterlight { background: radial-gradient(ellipse at 50% 120%, rgba(255, 196, 120, 0.95), rgba(214, 120, 120, 0.85) 35%, rgba(40, 46, 96, 0.92) 80%); animation: fadein 1.4s ease-out; }
.cutscene.epilogue .cs-inner { max-height: 94vh; overflow-y: auto; padding: 8px 4px; }
.cutscene.epilogue h1 { font-size: clamp(36px, 7vw, 64px); }
.cutscene.epilogue { background: linear-gradient(160deg, rgba(30, 48, 52, 0.92), rgba(120, 70, 80, 0.88)); animation: fadein 1s ease-out; }
.sweep { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 240, 200, 0.55) 50%, transparent 70%); background-size: 300% 100%; animation: sweep 3.2s ease-out forwards; pointer-events: none; }
@keyframes sweep { from { background-position: 100% 0; } to { background-position: -50% 0; } }
@keyframes fadein { from { opacity: 0; } }
.cs-inner { position: relative; max-width: 620px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.cs-inner h1, .title-card h1 { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 11vw, 96px); margin: 0; line-height: 1; color: #fff6e4; text-shadow: 0 4px 30px rgba(255, 180, 90, 0.6); letter-spacing: 0.01em; }
.cs-inner p { margin: 0; font-size: 17px; line-height: 1.55; color: #fff6e4; max-width: 56ch; }
.cs-inner p.q { font-family: var(--display); font-size: 21px; }
.eyebrow { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 800; color: #ffe2a8; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; width: 100%; }
.stats div { background: rgba(255,246,228,0.1); border-radius: 12px; padding: 10px; display: grid; gap: 2px; }
.stats b { font-size: 26px; font-weight: 800; }
.stats span { font-size: 12.5px; color: #f3e6d0; }
#title { background: linear-gradient(90deg, rgba(18, 26, 30, 0.82), rgba(18, 26, 30, 0.35) 60%, rgba(18, 26, 30, 0.1)); place-items: center start; padding-left: max(24px, 7vw); overflow: auto; }
.title-card { max-width: 520px; display: grid; gap: 14px; }
.title-card .sub { font-size: 17px; line-height: 1.55; margin: 0; color: #f3e9d8; max-width: 46ch; }
.title-card .row { display: flex; gap: 10px; flex-wrap: wrap; }
.title-card .btn { font-size: 16px; padding: 12px 20px; }
.title-card.creator { max-width: 760px; background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
.title-card.creator h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.cc-grid { display: grid; grid-template-columns: 220px 1fr; gap: 18px; }
#cc-preview { width: 220px; height: 240px; border-radius: 14px; }
.cc-fields { display: grid; gap: 6px; align-content: start; min-width: 0; }
.cc-fields label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; color: var(--amber); margin-top: 4px; }
.cc-fields input { font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(251,243,228,0.08); color: var(--text); }
.sw, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); }
.swatch.on { border-color: #fff; box-shadow: 0 0 0 2px var(--amber); }
.chipbtn { background: rgba(251,243,228,0.07); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-weight: 700; font-size: 13px; }
.chipbtn.on { background: var(--amber); color: #2a1e10; border-color: transparent; }
#fade { position: fixed; inset: 0; background: #0e1420; opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 30; }
#fade.on { opacity: 1; }

@media (max-width: 720px) {
  .ibtn span, #btn-morning span { display: none; }
  #hud-tl { padding: 8px; gap: 6px; }
  .time b { font-size: 21px; }
  .res { gap: 10px; padding: 6px 10px; flex-wrap: wrap; justify-content: flex-end; }

<script>
(() => {

// ===== 01_util.js =====
// ---------- small math + color helpers ----------
const TAU = Math.PI * 2;

const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

function rng(seed) {
  let s = (seed >>> 0) || 1;

    s ^= s << 13; s >>>= 0;

// The whole town is color-graded by "warmth": muted and hazy at first,
// saturated and golden as community life returns. GRADE is 0..20.
let GRADE = 0;
const _colCache = new Map();
function gradeRGB(hex, k) {

  ctx.arcTo(x + w, y + h, x, y + h, r);

function fmtMoney(v) { const s = Math.round(Math.abs(v)).toLocaleString('en-US'); return (v < 0 ? '−$' : '$') + s; }

}

// ===== 02_world.js =====
// ---------- the neighborhood: layout, collision, pathfinding ----------
const W = 2400, WH = 1700;
const CELL = 16;
const GW = Math.ceil(W / CELL), GH = Math.ceil(WH / CELL);

// Building footprints are ground rectangles (x,y = back-left, w x d). Visuals rise above the front edge.
const BUILDINGS = {

  mara:   { x: 560, y: 766, w: 180, d: 84, h: 112, kind: 'house', wall: '#ead6a2', roof: '#c76a40', trim: '#3f7a8c', name: "Mara's house" },

  depot:  { x: 96, y: 856, w: 180, d: 84, h: 100, kind: 'shed', wall: '#a99a86', roof: '#7d6f66', trim: '#6b5b4b', name: 'Old rail depot' },
};
BUILDINGS.store.door = { x: 1150, y: 640 };
BUILDINGS.juno.door = { x: 700, y: 488 };
BUILDINGS.mara.door = { x: 650, y: 850 };

// Lots where projects and creations get built.
const LOTS = {

  pavilion:  { x: 790, y: 944, w: 180, d: 100, name: 'Plaza green' },

const POI = {
  busStop: { x: 1150, y: 1585 }, busExit: { x: 1150, y: 1690 },
  plaza: { x: 1150, y: 900 }, fountain: { x: 1150, y: 830 },

  storeCounter: { x: 1150, y: 668 },
  depotSalvage: { x: 250, y: 1010 }, towerSalvage: { x: 332, y: 488 }, riverSalvage: { x: 1990, y: 1072 },
  garageSalvage: { x: 1580, y: 1018 }, framesSalvage: { x: 940, y: 1390 },
  waterfallSpot: { x: 1830, y: 420 }, terraceSpot: { x: 1440, y: 712 },
  sunfield: { x: 1520, y: 1460 }, maraPorch: { x: 708, y: 874 }, teoGarden: { x: 548, y: 1318 },
  junoBench: { x: 860, y: 520 }, plazaBench1: { x: 1000, y: 930 }, plazaBench2: { x: 1300, y: 930 },
  plazaBench3: { x: 1030, y: 742 }, accordion: { x: 1080, y: 990 }, workshopBikes: { x: 1700, y: 1010 },
  kitchenTable: { x: 1440, y: 680 }, riverside: { x: 2380, y: 950 }, pavilionSpot: { x: 880, y: 1062 },
};

const PLAZA = { x: 1150, y: 846, rx: 214, ry: 150 };
const POND = { x: 1860, y: 1480, rx: 200, ry: 112 };

const STREAM = [[1990, 330], [2030, 470], [1985, 620], [2012, 780], [2070, 940], [2086, 1100], [2032, 1262], [1940, 1392], [1880, 1450]];
const STREAM_W = 66;

const ROADS = [
  { w: 46, pts: [[1150, 1700], [1150, 1560], [1150, 994]] },
  { w: 40, pts: [[950, 850], [770, 860], [560, 892], [380, 930], [280, 960]] },
  { w: 34, pts: [[650, 850], [656, 878]] },
  { w: 38, pts: [[1004, 744], [880, 590], [740, 500], [520, 486], [340, 488]] },
  { w: 38, pts: [[1006, 952], [860, 1080], [740, 1236], [620, 1300]] },
  { w: 30, pts: [[860, 1100], [900, 1200], [940, 1262]] },
  { w: 42, pts: [[1356, 860], [1480, 996], [1700, 1004], [1880, 970], [2020, 942], [2400, 946]] },
  { w: 36, pts: [[1150, 700], [1150, 640]] },
  { w: 32, pts: [[1300, 760], [1380, 700]] },
  { w: 34, pts: [[1250, 1000], [1380, 1160], [1500, 1236]] },
  { w: 30, pts: [[1250, 650], [1480, 540], [1680, 440], [1820, 420]] },
];

const blocked = new Uint8Array(GW * GH);
const COLLIDERS = []; // {type:'rect'|'circle'|'ellipse', ...} - rebuilt when projects appear

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function polyDist(px, py, pts) {
  let d = Infinity;
  for (let i = 0; i < pts.length - 1; i++) d = Math.min(d, segDist(px, py, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]));
  return d;
}
function roadDist(x, y) {
  let d = Infinity;
  for (const r of ROADS) d = Math.min(d, polyDist(x, y, r.pts) - r.w / 2);
  const pe = ((x - PLAZA.x) / PLAZA.rx) ** 2 + ((y - PLAZA.y) / PLAZA.ry) ** 2;

}

  if (((x - POOL.x) / POOL.rx) ** 2 + ((y - POOL.y) / POOL.ry) ** 2 < 1) return true;
  return polyDist(x, y, STREAM) < STREAM_W / 2;

// ----- trees and props (seeded, deterministic) -----
const TREES = [];
const PROPS = [];
function nearAnyLot(x, y, pad) {
  for (const k in BUILDINGS) { const b = BUILDINGS[k]; if (x > b.x - pad && x < b.x + b.w + pad && y > b.y - pad - 60 && y < b.y + b.d + pad) return true; }
  for (const k in LOTS) { const b = LOTS[k]; if (x > b.x - pad && x < b.x + b.w + pad && y > b.y - pad - 40 && y < b.y + b.d + pad) return true; }

}
function buildScenery() {
  const R = rng(20251017);
  const fixed = [
    // cypress lines along the main road and the store
    ...[1040, 1260].flatMap(x => [1080, 1200, 1320, 1440].map(y => ({ x: x + (x < 1150 ? 0 : 0), y, kind: 'cypress' }))),

    { x: 520, y: 760, kind: 'olive' }, { x: 790, y: 760, kind: 'round' }, { x: 860, y: 1180, kind: 'olive' },
    { x: 600, y: 1140, kind: 'lemon' }, { x: 470, y: 1220, kind: 'lemon' }, { x: 840, y: 420, kind: 'round' },
    { x: 590, y: 420, kind: 'cypress' }, { x: 1700, y: 1180, kind: 'olive' }, { x: 1360, y: 1080, kind: 'round' },
    { x: 1700, y: 760, kind: 'round' }, { x: 1600, y: 800, kind: 'olive' }, { x: 1900, y: 560, kind: 'round' },

  ];
  for (const t of fixed) TREES.push({ ...t, seed: R() * 1000, s: 0.9 + R() * 0.25 });
  let tries = 0;
  while (TREES.length < 115 && tries++ < 4000) {
    const x = 40 + R() * (W - 80), y = 270 + R() * (WH - 320);
    if (roadDist(x, y) < 40) continue;
    if (inWater(x, y) || polyDist(x, y, STREAM) < 70 || ((x - POND.x) / (POND.rx + 50)) ** 2 + ((y - POND.y) / (POND.ry + 40)) ** 2 < 1) continue;

    if (Math.abs(x - 1150) < 260 && Math.abs(y - 846) < 200) continue;

    if (TREES.some(t => dist(t.x, t.y, x, y) < 70)) continue;
    const r = R();
    TREES.push({ x, y, kind: r < 0.45 ? 'round' : r < 0.7 ? 'olive' : r < 0.9 ? 'cypress' : 'bush', seed: R() * 1000, s: 0.85 + R() * 0.35 });

  PROPS.push({ kind: 'bench', x: POI.junoBench.x, y: POI.junoBench.y - 4 });
  PROPS.push({ kind: 'notice', x: POI.notice.x, y: POI.notice.y - 18 });
  PROPS.push({ kind: 'busstop', x: 1236, y: 1566 });
  PROPS.push({ kind: 'tower', x: 330, y: 440 });
  PROPS.push({ kind: 'sign', x: 2250, y: 990, text: 'Riverside 3 km' });
  PROPS.push({ kind: 'van', x: 860, y: 1236 });
  const beds = [[980, 700], [1320, 700], [960, 980], [1340, 980], [610, 900], [780, 540], [700, 1260], [1360, 1050], [1530, 1060], [1180, 680], [1110, 680]];

function addRect(x, y, w, h) { COLLIDERS.push({ type: 'rect', x, y, w, h }); }
function addEllipse(x, y, rx, ry) { COLLIDERS.push({ type: 'ellipse', x, y, rx, ry }); }

function rebuildColliders(state) {
  COLLIDERS.length = 0;

      const L = LOTS.greenhouse; addRect(L.x + 10, L.y + 8, L.w - 20, L.d - 30);

function buildGrid() {
  blocked.fill(0);
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
    const x = gx * CELL + CELL / 2, y = gy * CELL + CELL / 2;
    let b = 0;
    if (y < 262 || x < 20 || x > W - 14 || y > WH - 8) b = 1;
    else if (inWater(x, y)) b = 1;
    else if (x > 280 && x < 370 && y > 560 && y < 1560 && !(y > 900 && y < 1060)) b = 0; // rails are walkable
    if (!b) for (const c of COLLIDERS) {
      if (c.type === 'rect') { if (x > c.x - 4 && x < c.x + c.w + 4 && y > c.y - 4 && y < c.y + c.h + 4) { b = 1; break; } }
      else if (((x - c.x) / (c.rx + 4)) ** 2 + ((y - c.y) / (c.ry + 4)) ** 2 < 1) { b = 1; break; }
    }
    if (x >= W - 14 && y > 900 && y < 990) b = 0; // road to Riverside reaches the edge
    if (y > WH - 8 && x > 1110 && x < 1190) b = 0;
    blocked[gy * GW + gx] = b;
  }
}
function cellBlocked(gx, gy) { return gx < 0 || gy < 0 || gx >= GW || gy >= GH || blocked[gy * GW + gx] === 1; }
function walkable(x, y) { return !cellBlocked(Math.floor(x / CELL), Math.floor(y / CELL)); }
function footFree(x, y) {
  const r = 7;
  return walkable(x, y) && walkable(x - r, y) && walkable(x + r, y) && walkable(x, y - 4) && walkable(x, y + 3);
}
function nearestWalkable(x, y) {
  let gx = Math.floor(x / CELL), gy = Math.floor(y / CELL);
  if (!cellBlocked(gx, gy)) return { x, y };
  for (let r = 1; r < 30; r++) {
    let best = null, bd = Infinity;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
      if (!cellBlocked(gx + dx, gy + dy)) { const d = dx * dx + dy * dy; if (d < bd) { bd = d; best = [gx + dx, gy + dy]; } }
    }
    if (best) return { x: best[0] * CELL + CELL / 2, y: best[1] * CELL + CELL / 2 };
  }

}

// A* on the grid, then string-pulled for natural-looking walks.
function findPath(sx, sy, tx, ty) {
  const t = nearestWalkable(tx, ty);
  const s = nearestWalkable(sx, sy);
  const sgx = Math.floor(s.x / CELL), sgy = Math.floor(s.y / CELL);
  const tgx = Math.floor(t.x / CELL), tgy = Math.floor(t.y / CELL);
  const N = GW * GH;
  const g = new Float32Array(N).fill(Infinity);
  const came = new Int32Array(N).fill(-1);
  const closed = new Uint8Array(N);
  const heap = [];
  const push = (i, f) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
  const pop = () => { const top = heap[0]; const last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top; };
  const h = (x, y) => { const dx = Math.abs(x - tgx), dy = Math.abs(y - tgy); return (dx + dy) + (1.414 - 2) * Math.min(dx, dy); };
  const si = sgy * GW + sgx, ti = tgy * GW + tgx;
  g[si] = 0; push(si, h(sgx, sgy));
  let found = false, iter = 0;
  while (heap.length && iter++ < 30000) {
    const [, i] = pop();
    if (closed[i]) continue;
    if (i === ti) { found = true; break; }
    closed[i] = 1;
    const x = i % GW, y = (i / GW) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (cellBlocked(nx, ny)) continue;
      if (dx && dy && (cellBlocked(x + dx, y) || cellBlocked(x, y + dy))) continue;
      const ni = ny * GW + nx;
      const ng = g[i] + (dx && dy ? 1.414 : 1);
      if (ng < g[ni]) { g[ni] = ng; came[ni] = i; push(ni, ng + h(nx, ny)); }
    }
  }
  if (!found) return [{ x: t.x, y: t.y }];
  const cells = [];
  for (let i = ti; i !== -1; i = came[i]) cells.push(i);
  cells.reverse();
  const pts = cells.map(i => ({ x: (i % GW) * CELL + CELL / 2, y: ((i / GW) | 0) * CELL + CELL / 2 }));
  pts[pts.length - 1] = { x: t.x, y: t.y };
  // string pulling
  const out = [];
  let a = { x: sx, y: sy };
  let k = 0;
  while (k < pts.length) {
    let far = k;
    for (let j = pts.length - 1; j > k; j--) { if (lineClear(a.x, a.y, pts[j].x, pts[j].y)) { far = j; break; } }
    out.push(pts[far]); a = pts[far]; k = far + 1;
  }
  return out;
}
function lineClear(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay);
  const n = Math.ceil(d / 6);
  for (let i = 1; i <= n; i++) {
    const x = ax + (bx - ax) * i / n, y = ay + (by - ay) * i / n;
    if (!walkable(x, y) || !walkable(x - 6, y) || !walkable(x + 6, y)) return false;
  }
  return true;
}

// ----- economy -----
function H(id) { return S.households[id]; }
function online(pid) { return S.projects[pid] && S.projects[pid].status === 'online'; }
function choresOf() { return online('workshop') ? 1.5 : 2.5; }

function expensesOf(id) {
  const b = RES[id].base;
  const P = S.projects;
  let power = b.power, food = b.food, transport = b.transport;
  if (online('solar')) power = P.solar.option === 'brightline' ? b.power * (S.flags.blHike ? 1.1 : 0.75) : 2;
  if (online('workshop')) transport = b.transport * (P.workshop.option === 'brightline' ? 0.6 : 0.35) * (P.workshop.upgrades.bikes ? 0.6 : 1);
  if (online('greenhouse')) food = b.food * 0.5 * (P.greenhouse.upgrades.aqua ? 0.8 : 1);
  const total = b.housing + food + power + transport + b.other;
  const baseTotal = b.housing + b.food + b.power + b.transport + b.other;
  return { housing: b.housing, food, power, transport, other: b.other, total, baseTotal };
}

function projectEcon(pid, actual) {
  const p = S.projects[pid], d = PROJECTS[pid];
  if (!p || p.status !== 'online') return { revenue: 0, op: 0, net: 0, fab: 0 };
  let revenue = d.revenue;
  let fab = d.fab || 0;
  let nUp = 0;
  for (const u of d.upgrades) if (p.upgrades[u.id]) { revenue += u.revenue; fab += u.fab || 0; nUp++; }
  if (pid === 'solar') revenue *= (actual ? WEATHER[S.weather].solar : 0.9) * (p.damaged ? 0.55 : 1);
  if (pid === 'greenhouse' && actual && S.weather === 'rain') revenue *= 1.1;
  if (pid === 'workshop') { revenue *= p.ramp; fab = Math.round(fab * p.ramp); }
  let op = d.op + nUp * 4;
  if (pid === 'compute') op += computePowerCost();
  return { revenue, op, net: revenue - op, fab };
}

// Compute racks run on the array: nearly free if the street owns it, a real bill if Brightline does or there is no array.
function computePowerCost() { return !online('solar') ? 34 : S.projects.solar.option === 'brightline' ? 26 : 2; }
function incomeOf(id, actual) {
  const by = {};
  let total = 0;
  for (const pid in PROJECTS) {
    const p = S.projects[pid];
    if (p.status !== 'online' || !p.owners) continue;
    const share = p.owners[id] || 0;
    if (!share) continue;
    const v = Math.max(0, projectEcon(pid, actual).net) * share;
    by[pid] = v; total += v;
  }
  return { total, by };
}
function requiredWork(id) {
  const e = expensesOf(id), i = incomeOf(id);
  return Math.max(0, (e.total - i.total) / RES[id].wage);
}

}

    for (const id of RES_IDS) o[id] = min + (0.8 - min * 4) * (g[id] / tot);
    return o;
  }
  return null;
}
function communityPartsFor(pid, option) {
  const cost = PROJECTS[pid].parts;
  if (option === 'brightline') return 0;
  if (option === 'odile') return Math.ceil(cost / 2);
  return cost;
}
function pledgesFor(pid, option) { return (pid === 'solar' && option !== 'brightline') ? (option === 'odile' ? 20 : 20) : 0; }
function affordable(partsNeeded) {
  const fromFund = Math.max(0, partsNeeded - S.parts);
  const fundCost = fromFund * 4;
  return { ok: fundCost <= S.fund, fromStock: Math.min(S.parts, partsNeeded), fromFund, fundCost };
}
function spendParts(n) {
  const a = affordable(n);
  S.parts -= a.fromStock; S.fund -= a.fundCost;
  return a;
}

// Evaluate a hypothetical: what would each household look like if pid ran with these owners?
function projectWith(pid, option) {
  const p = S.projects[pid];
  const saved = { status: p.status, owners: p.owners, option: p.option, ramp: p.ramp };
  const before = {};
  for (const id of RES_IDS) before[id] = { exp: expensesOf(id).total, inc: incomeOf(id).total, work: requiredWork(id) };
  p.status = 'online'; p.owners = ownersFor(option); p.option = option; p.ramp = 1;
  const after = {};
  for (const id of RES_IDS) after[id] = { exp: expensesOf(id).total, inc: incomeOf(id).total, work: requiredWork(id) };
  const econ = projectEcon(pid);
  const owners = p.owners;
  Object.assign(p, saved);

}

function rollWeather(day) {
  const scripted = { 1: 'cloudy', 2: 'sunny', 3: 'sunny', 4: 'cloudy', 5: 'sunny' };
  if (S.flags.stormNext) { S.flags.stormNext = false; return 'storm'; }
  if (scripted[day]) return scripted[day];
  const r = hash(day * 7.31);
  return r < 0.58 ? 'sunny' : r < 0.82 ? 'cloudy' : 'rain';
}

// ----- the night: accrue, build, adjust lives -----
function endOfDay() {
  const report = { day: S.day, weather: S.weather, projects: {}, households: {}, parts: 0, fund: 0, events: [] };
  // 1. income accrues for the day that just ended
  for (const pid in PROJECTS) {
    const p = S.projects[pid];
    if (p.status !== 'online') continue;
    const e = projectEcon(pid, true);
    report.projects[pid] = e;
    const net = Math.max(0, e.net);
    if (p.owners) {
      const c = (p.owners.commons || 0) * net;
      S.fund += c; report.fund += c;
    }
    if (e.fab) { const f = Math.round(e.fab * (p.owners && p.owners.brightline ? 0.4 : 1)); S.parts += f; report.parts += f; }
  }
  // 2. construction
  const finished = [];
  for (const pid in PROJECTS) {
    const p = S.projects[pid];
    if (p.status === 'building') {
      p.buildLeft--;
      if (p.buildLeft <= 0) { p.status = 'online'; p.builtDay = S.day + 1; if (pid === 'workshop') p.ramp = 0.6; finished.push(pid); }
    } else if (p.status === 'online' && pid === 'workshop' && p.ramp < 1) p.ramp = Math.min(1, round1(p.ramp + 0.2));
    if (p.pending) { p.upgrades[p.pending] = true; report.events.push(`${PROJECTS[pid].upgrades.find(u => u.id === p.pending).name} installed at the ${PROJECTS[pid].name}.`); p.pending = null; }
  }
  for (const cid in CREATIONS) {
    const c = S.creations[cid];
    if (c.status === 'building') { c.buildLeft--; if (c.buildLeft <= 0) { c.status = 'built'; c.builtDay = S.day + 1; finished.push(cid); } }
  }
  // 3. new day
  S.day++;
  if (S.flags.stormArmed && !S.flags.stormDone && online('solar')) { S.flags.stormNext = true; S.flags.stormDone = true; }
  S.weather = rollWeather(S.day);
  // Brightline's introductory discount ends
  if (online('solar') && S.projects.solar.option === 'brightline' && !S.flags.blHike && S.day - S.projects.solar.builtDay >= 2) {
    S.flags.blHike = true;
    report.events.push('A letter from Brightline: the introductory discount has ended. Power on the street now costs 10% more than it did before the array.');
    logEvent('Brightline ended its discount. Power bills went up.', 'note');
  }
  if (S.weather === 'storm' && online('solar') && !S.projects.solar.damaged) {
    S.projects.solar.damaged = true;
    report.events.push('A windstorm tore loose a row of panels on Sunfield. The array is running at half strength.');
    S.flags.solarDamaged = true;
  }
  // 4. households re-plan their week around expected income
  for (const id of RES_IDS) {
    const h = H(id);
    const before = h.work;
    h.worked = (h.worked || 0) + h.work;
    const req = requiredWork(id);
    let nw;
    if (req < h.work) nw = Math.max(req, h.work - 4.5);
    else nw = req;
    nw = nw <= 0.05 ? 0 : Math.ceil(nw * 2) / 2;
    h.work = nw;
    const free = freeTime(id);
    let target = 10 + free * 6.4 + (h.stage === 'thriving' ? 12 : 0) + h.rel * 0.06;
    target = clamp(target, 6, 100);
    h.energy = clamp(h.energy + (target - h.energy) * 0.45, 0, 100);
    // stage changes
    const prev = h.stage;
    if (h.work > 0) { if (h.stage === 'rest' || h.stage === 'thriving') { /* setback */ } h.stage = h.work >= 6 ? 'overworked' : 'easing'; }
    else if (prev === 'overworked' || prev === 'easing') { h.stage = 'rest'; h.stageDays = 0; h.coveredDay = S.day; }
    else if (prev === 'rest') {
      h.stageDays++;
      const need = { mara: 1, teo: 1, juno: 1, odile: 1 }[id];
      if ((h.stageDays >= need && (h.nudged || id === 'odile' || id === 'mara')) || h.stageDays >= need + 2) { h.stage = 'thriving'; h.stageDays = 0; }
    } else if (prev === 'thriving') h.stageDays++;
    if (prev !== h.stage) report.households[id] = { from: prev, to: h.stage };
    if (before - h.work >= 0.5) report.events.push(`${RES[id].short} cut ${fmtHours(before - h.work)} of paid work a day${h.work <= 0 ? ', and no longer needs a job to cover the essentials' : ''}.`);
    else if (h.work - before >= 0.5) report.events.push(`${RES[id].short} had to pick up ${fmtHours(h.work - before)} more work a day.`);
    if (prev !== 'thriving' && h.stage === 'thriving') report.events.push(thriveLine(id));
    h.history.push(snapshotHH(id));
    if (h.history.length > 60) h.history.shift();
  }
  // 5. story beats that happen overnight
  for (const pid of finished) onFinished(pid, report);
  morningStory(report);
  updateWarmthTarget();
  S.warmth = lerp(S.warmth, S.warmthTarget, 0.55);
  S.lastReport = report;
  return report;
}

function rebuildSchedules() { for (const id of RES_IDS) SCHED[id] = buildSchedule(id); }

function currentBlock(id) {
  const m = S.minute % 1440;
  const n = NPCS[id];
  if (n && n.override && S.minute < n.override.until) return n.override;
  const sc = SCHED[id] || [];
  let last = sc[0];
  for (const b of sc) { if (m >= b.from && m < b.to) return b; if (b.from <= m) last = b; }
  return last || { act: 'home', at: BUILDINGS[RES[id].home].door, hidden: true };
}
function blockTarget(id, b) {
  let at = b.at;
  if (b.act === 'social') at = { x: SOCIAL_SPOT.x + SOCIAL_OFF[id][0], y: SOCIAL_SPOT.y + SOCIAL_OFF[id][1] };
  return at;
}

function initNPCs() {
  for (const id of RES_IDS) NPCS[id] = { id, x: 0, y: 0, visible: false, path: [], key: '', facing: 1, phase: 0, moving: false, pose: 'stand', bubble: null, barkCD: 0, wander: null, mood: 'tired', override: null };
  rebuildSchedules();
  placeAllNPCs();
}
function placeAllNPCs() {
  for (const id of RES_IDS) {
    const n = NPCS[id];
    n.override = null;
    const b = currentBlock(id);
    const t = blockTarget(id, b);
    n.x = t.x; n.y = t.y; n.path = []; n.key = t.x + ',' + t.y; n.visible = !b.hidden; n.pose = b.pose || 'stand'; n.moving = false; n.wander = null;
  }
}

function npcMood(id, b, moving) {
  const h = H(id);
  if (b.act === 'away' && moving) return 'rushed';
  if (h.stage === 'thriving') return 'happy';
  if (h.stage === 'rest') return h.energy > 60 ? 'calm' : 'neutral';
  if (h.energy < 36) return 'tired';
  if (h.energy > 62) return 'happy';
  return 'neutral';
}
function npcSpeed(mood) { return { rushed: 38, tired: 19, neutral: 25, calm: 22, happy: 26 }[mood] || 25; }

function updateNPCs(dt, gmps) {
  for (const id of RES_IDS) {
    const n = NPCS[id];
    const b = currentBlock(id);
    let t = blockTarget(id, b);
    if (b.act === 'wander') {
      if (!n.wander || S.minute > n.wander.until) {
        const a = Math.random() * TAU, r = 40 + Math.random() * 110;
        const p = nearestWalkable(t.x + Math.cos(a) * r, t.y + Math.sin(a) * r * 0.7);
        n.wander = { x: p.x, y: p.y, until: S.minute + 12 + Math.random() * 20 };
      }
      t = n.wander;
    } else n.wander = null;
    const key = Math.round(t.x) + ',' + Math.round(t.y);
    if (key !== n.key) {
      n.key = key;
      if (dist(n.x, n.y, t.x, t.y) > 6) { n.visible = true; n.path = findPath(n.x, n.y, t.x, t.y); }
      else n.path = [];
    }
    n.moving = n.path.length > 0;
    n.mood = npcMood(id, b, n.moving);
    if (n.moving) {
      let step = npcSpeed(n.mood) * gmps * dt;
      while (step > 0 && n.path.length) {
        const p = n.path[0];
        const dx = p.x - n.x, dy = p.y - n.y, d = Math.hypot(dx, dy);
        if (d <= step) { n.x = p.x; n.y = p.y; n.path.shift(); step -= d; }
        else { n.x += dx / d * step; n.y += dy / d * step; if (Math.abs(dx) > 1) n.facing = dx > 0 ? 1 : -1; n.dirY = dy; step = 0; }
      }
      n.phase += dt * (n.mood === 'rushed' ? 11 : n.mood === 'tired' ? 6 : 8) * Math.min(3, Math.max(1, gmps / 2));
      if (!n.path.length && b.hidden) n.visible = false;
    } else {
      if (b.hidden && !(n.override && S.minute < n.override.until)) n.visible = false;
      else n.visible = true;
      n.pose = b.pose || 'stand';
      if (b.act === 'social') n.facing = n.x < SOCIAL_SPOT.x ? 1 : -1;
      if (b.act === 'store') n.facing = 1;
    }
    if (n.barkCD > 0) n.barkCD -= dt;
    if (n.bubble) { n.bubble.t -= dt; if (n.bubble.t <= 0) n.bubble = null; }
  }
  // Pip trails his mother once she has time for him
  const m = NPCS.mara;
  const pipOut = m.visible && H('mara').stage !== 'overworked' && S.minute % 1440 > 9 * 60 && S.minute % 1440 < 19.5 * 60;
  if (pipOut) {
    const tx = m.x + (m.facing > 0 ? -26 : 26), ty = m.y + 8;
    if (!PIP.visible) { PIP.x = tx; PIP.y = ty; }
    const d = dist(PIP.x, PIP.y, tx, ty);
    PIP.moving = d > 4;
    if (d > 2) { const k = Math.min(1, dt * 4); PIP.x += (tx - PIP.x) * k; PIP.y += (ty - PIP.y) * k; PIP.facing = tx > PIP.x ? 1 : -1; PIP.phase += dt * 12; }
    PIP.visible = true;
  } else PIP.visible = false;
}

// Short lines residents say when you pass by.
function barkFor(id) {
  const n = NPCS[id], b = currentBlock(id), h = H(id);
  const r = Math.random();
  if (b.act === 'away' && n.moving) return pick({
    mara: ["Can't stop, the bus!", 'Late, late, late.', 'Morning. Bye.'],
    teo: ['Hm.', 'Route starts at six.', 'Not now.'],
    juno: ['Sorry, sorry, bus.', "Coffee doesn't pour itself.", '...hi. Bye.'],
    odile: ['Busy.'],
  }[id]);
  if (b.act === 'store') return pick(h.stage === 'overworked' ? ["Milk's in the back.", 'Prices went up again. Not my fault.', 'Twelve hours. Every day.'] : ['Take a peach, they are good today.', 'I close at noon now. Imagine.', 'Morning, neighbor!']);
  if (b.act === 'accordion') return pick(['♪ This one is for my father.', '♪ I know three songs. This is one of them.', '♪ Clap or go home!']);
  if (b.act === 'sketch' || b.act === 'paint') return pick(['Hold still, I’m drawing the light.', 'Page fourteen!', 'Look at the color of that water.']);
  if (b.act === 'bake' || b.act === 'bakehome') return pick(['Cardamom. Trust me.', 'First loaf is for Teo, before he knocks.', 'The dough is rising and so am I.']);
  if (b.act === 'garden') return pick(h.stage === 'thriving' ? ['Purple ones. Rosa’s.', 'Soil this good, you could grow a piano.', 'Mind the seedlings!'] : ['Weeds win again.', 'Rosa would be ashamed of me.', 'Too tired for this.']);
  if (b.act === 'bikes') return pick(['Three bikes fixed today.', 'The robots are fast learners. Faster than Pip.', 'Want a bicycle? I have extras.']);
  if (b.act === 'social') return pick(['Ha! Teo, no.', 'Pass the peaches.', 'Did you see Juno’s drawing?', 'Same time tomorrow?']);
  if (b.act === 'busstop') return 'Forty years of six o\u2019clock alarms. My body still remembers.';
  if (b.act === 'tea') return pick(['Tea, while it’s hot. Revolutionary.', 'I’m not doing anything. On purpose.']);
  if (b.act === 'breakfast') return pick(['Pass the jam!', 'Mara, this bread...', 'Sunday breakfast. Best idea we ever had.']);
  if (h.energy < 36) return pick({ mara: ['So tired.', 'Long day.'], teo: ['My back...', 'Hm.'], juno: ['Need sleep.', 'Brain is soup.'], odile: ['My feet.', 'Long day.'] }[id]);
  return r < 0.5 ? 'Hi, ' + S.player.name + '!' : pick(['Nice evening.', 'Hello again.', 'Good to see you.']);
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function knockDoor(id) {
  const n = NPCS[id];
  const door = BUILDINGS[RES[id].home].door;
  const m = S.minute % 1440;
  const b = currentBlock(id);
  if (b.act !== 'home' && b.act !== 'gig' && b.act !== 'bakehome') return 'out';
  if (m < 6.5 * 60 || m > 22 * 60) return 'asleep';
  n.override = { act: 'door', at: { x: door.x + 18, y: door.y + 26 }, pose: 'stand', until: S.minute + 45 };
  n.x = door.x; n.y = door.y + 4; n.visible = true; n.path = []; n.key = '';
  return 'ok';
}

const L = (s, t, mood) => ({ s, t, mood });
const FX = fn => ({ fx: fn });
const CH = (...choices) => ({ choices });
function befriend(id, n) { H(id).rel = clamp(H(id).rel + n, 0, 100); }
function curAct(id) { return currentBlock(id).act; }
function seen(k) { return !!S.seen[k]; }
function see(k) { S.seen[k] = true; }

function afterMeet() {
  if (S.quest === 'meet' && RES_IDS.every(id => H(id).met)) {
    S.projects.solar.status = 'idea';
    setQuest('idea_solar');
    hooks.bolt("Power bills came up with all four of them. And Sunfield meadow gets sun all day. I have an idea, {name}. To the workbench!");
  }
}
function topOwner(pid) {
  const o = S.projects[pid].owners || {};
  let best = null, v = -1;
  for (const k in o) if (o[k] > v) { v = o[k]; best = k; }
  return best;
}

function talkTo(id) {
  const h = H(id);
  const steps = [];
  if (h.talkedDay !== S.day) { h.talkedDay = S.day; if (h.met) befriend(id, 3); }
  const fn = { mara: talkMara, teo: talkTeo, juno: talkJuno, odile: talkOdile }[id];

}
function projectsLine(id) {
  const anyOnline = Object.keys(PROJECTS).some(online);
  if (!anyOnline) return { mara: 'I’ll believe it when my bills believe it.', teo: 'Show me something that runs and I’ll have an opinion.', juno: 'I like that someone’s trying. That’s new.', odile: 'Projects cost money. Who pays, who owns, who gets paid. Get that right and I’m listening.' }[id];
  const inc = incomeOf(id).total;
  const owners = {};
  for (const pid in PROJECTS) if (online(pid)) { const o = S.projects[pid].owners || {}; for (const k in o) owners[k] = (owners[k] || 0) + o[k]; }
  let top = null, tv = 0; for (const k in owners) if (owners[k] > tv) { tv = owners[k]; top = k; }
  const concentrated = top && top !== id && top !== 'commons' && tv > (owners[id] || 0) * 2.2;
  if (concentrated) {
    const who = OWNER_NAMES[top];
    return { mara: `The bills are better. But most of the money goes to ${who}. Good for them. I’m still on the bus.`, teo: `${who} gets the big share. I get the small one. The math is not hard.`, juno: `I mean, ${who} put in the money. But I still run for the bus, so.`, odile: `Most of it comes to me, which my bank likes. My neighbors are still tired, which I don’t.` }[id];
  }
  return { mara: `There’s a little deposit every morning. ${fmtMoney(inc)} a day. It’s not a lottery ticket. It’s better. It comes back tomorrow.`, teo: `${fmtMoney(inc)} a day from things we built. My father would’ve called it communism. My mother would’ve called it sense.`, juno: `${fmtMoney(inc)} a day that I don’t have to label cats for. I own a piece of a robot. That sentence is wild.`, odile: `${fmtMoney(inc)} a day, and it doesn’t need me behind a counter. The commons share pays for the next thing. That part I like most.` }[id];
}

// ---------- drawing the world ----------
let cvs, ctx, DPR = 1, VW = 0, VH = 0;
const cam = { x: 1150, y: 1400, zoom: 1.2, tx: 1150, ty: 1400 };
let GROUND_DRAB = null, GROUND_LUSH = null, COBBLE_A = null, COBBLE_B = null;
const GSCALE = 0.75;
let TIME = 0; // real seconds, for animation
let LOW_FX = false; // set when the device is too slow for decorative effects
const PARTICLES = [];

function setupCanvas(c) {
  cvs = c; ctx = c.getContext('2d');
  resize();
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = cvs.clientWidth; VH = cvs.clientHeight;
  cvs.width = Math.round(VW * DPR); cvs.height = Math.round(VH * DPR);
  const base = VW < VH ? Math.min(VW / 520, VH / 900) : Math.min(VW / 980, VH / 640);
  cam.baseZoom = clamp(base, 0.62, 1.7);
  if (!cam.userZoom) cam.userZoom = 1.15;
}
function screenToWorld(sx, sy) {
  const z = cam.zoom;
  return { x: (sx - VW / 2) / z + cam.x, y: (sy - VH / 2) / z + cam.y };
}
function worldToScreen(x, y) {
  const z = cam.zoom;
  return { x: (x - cam.x) * z + VW / 2, y: (y - cam.y) * z + VH / 2 };
}

// ----- prerendered ground (two moods, crossfaded by warmth) -----
function makeGround(lush) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(W * GSCALE); c.height = Math.ceil(WH * GSCALE);
  const g = c.getContext('2d');
  g.scale(GSCALE, GSCALE);
  const R = rng(lush ? 77 : 78);
  const base = lush ? '#6a9636' : '#8b957a';
  const dark = lush ? '#3f7426' : '#77806a';
  const light = lush ? '#b0c154' : '#a1a68c';
  g.fillStyle = base; g.fillRect(0, 0, W, WH);
  for (let i = 0; i < 260; i++) {
    const x = R() * W, y = R() * WH, r = 60 + R() * 220;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const cc = R() < 0.5 ? dark : light;
    gr.addColorStop(0, cc + '66'); gr.addColorStop(1, cc + '00');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  if (lush) for (let i = 0; i < 60; i++) { // sunlit golden patches
    const x = R() * W, y = 280 + R() * (WH - 280), r = 50 + R() * 140;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, '#e2cf5c55'); gr.addColorStop(1, '#e2cf5c00');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  if (!lush) for (let i = 0; i < 70; i++) { // dry patches
    const x = R() * W, y = 280 + R() * (WH - 280), r = 30 + R() * 90;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, '#a89f7e88'); gr.addColorStop(1, '#a89f7e00');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const shades = lush ? ['#4c8430', '#5f9534', '#7aa83e', '#9cb84a', '#3e7228', '#c6c25a'] : ['#7a846a', '#848d73', '#949a80', '#6f775f', '#9c9a7e'];
  g.lineCap = 'round';
  for (let i = 0; i < 26000; i++) {
    const x = R() * W, y = R() * WH;
    g.strokeStyle = shades[(R() * shades.length) | 0];
    g.lineWidth = 1.4 + R() * 1.2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - 0.5) * 4, y - 4 - R() * 6); g.stroke();
  }
  if (lush) {
    const fl = ['#fff6e0', '#ffd75e', '#f59ab5', '#c9a0f0', '#ff9f6b'];
    for (let i = 0; i < 2600; i++) {
      const x = R() * W, y = 270 + R() * (WH - 270);
      g.fillStyle = fl[(R() * fl.length) | 0];
      g.beginPath(); g.arc(x, y, 1.6 + R() * 1.6, 0, TAU); g.fill();
    }
  }
  // stream banks and pond shore
  g.strokeStyle = lush ? '#b8a77a' : '#a29b84'; g.lineWidth = STREAM_W + 22; g.lineJoin = 'round';
  g.beginPath(); STREAM.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  g.fillStyle = lush ? '#b8a77a' : '#a29b84';
  g.beginPath(); g.ellipse(POND.x, POND.y, POND.rx + 16, POND.ry + 12, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(POOL.x, POOL.y, POOL.rx + 14, POOL.ry + 12, 0, 0, TAU); g.fill();
  // northern hills and the cliff
  const hill = lush ? ['#4f7f3c', '#5d8e45', '#6b9b4e'] : ['#6a7461', '#737d68', '#7c8670'];
  for (let layer = 0; layer < 3; layer++) {
    g.fillStyle = hill[layer];
    g.beginPath(); g.moveTo(0, 0);
    for (let x = 0; x <= W; x += 40) g.lineTo(x, 90 + layer * 55 + Math.sin(x * 0.004 + layer * 2) * 30 + Math.sin(x * 0.013 + layer) * 12);
    g.lineTo(W, 0); g.closePath(); g.fill();
  }
  g.fillStyle = hill[2];
  g.fillRect(0, 0, W, 60);
  // cliff face
  const cliffTop = x => 236 + Math.sin(x * 0.02) * 6;
  g.fillStyle = lush ? '#8d7b66' : '#857c72';
  g.beginPath(); g.moveTo(0, 230);
  for (let x = 0; x <= W; x += 20) g.lineTo(x, cliffTop(x));
  for (let x = W; x >= 0; x -= 20) g.lineTo(x, 268 + Math.sin(x * 0.03) * 5);
  g.closePath(); g.fill();
  for (let i = 0; i < 420; i++) {
    const x = R() * W, y = 238 + R() * 28;
    g.fillStyle = R() < 0.5 ? (lush ? '#a08d74' : '#968d82') : (lush ? '#6f604f' : '#6d665e');
    g.beginPath(); g.ellipse(x, y, 4 + R() * 9, 3 + R() * 4, 0, 0, TAU); g.fill();
  }
  g.fillStyle = lush ? '#5d8e45' : '#737d68';
  g.beginPath(); g.moveTo(0, 226);
  for (let x = 0; x <= W; x += 16) g.lineTo(x, cliffTop(x) + (R() * 4));
  g.lineTo(W, 200); g.lineTo(0, 200); g.closePath(); g.fill();
  // waterfall cliff
  g.fillStyle = lush ? '#7b6a58' : '#7a7168';
  g.beginPath(); g.moveTo(1930, 120); g.lineTo(2050, 110); g.lineTo(2070, 300); g.lineTo(1910, 300); g.closePath(); g.fill();
  for (let i = 0; i < 60; i++) {
    g.fillStyle = R() < 0.5 ? '#6a5a4a' : '#8f7c66';
    g.beginPath(); g.ellipse(1915 + R() * 150, 120 + R() * 180, 6 + R() * 10, 4 + R() * 6, 0, 0, TAU); g.fill();
  }
  // sunfield meadow tint
  g.fillStyle = lush ? '#9fc4664d' : '#a5a7804d';
  g.beginPath(); g.ellipse(1520, 1336, 260, 140, 0, 0, TAU); g.fill();
  return c;
}

function makeCobble(lush) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const R = rng(lush ? 5 : 6);
  g.fillStyle = lush ? '#b9804a' : '#b9b1a3'; g.fillRect(0, 0, 64, 64);
  for (let y = 0; y < 64; y += 11) for (let x = (y / 11) % 2 ? -6 : 0; x < 64; x += 13) {
    g.fillStyle = lush ? ['#e9bd7e', '#dca668', '#f0cc92', '#d39a5c'][(R() * 4) | 0] : ['#c2bbad', '#aea79b', '#cbc4b6', '#a39d92'][(R() * 4) | 0];
    rrect(g, x + 1, y + 1, 11, 9, 3); g.fill();
    g.strokeStyle = lush ? '#9a6436' : '#8f8a80'; g.lineWidth = 0.8; g.stroke();
    if (lush) { g.fillStyle = '#fff1cf55'; rrect(g, x + 2, y + 1.5, 7, 3, 1.5); g.fill(); }
  }
  return c;
}

function initArt() {
  GROUND_DRAB = makeGround(false);
  GROUND_LUSH = makeGround(true);
  COBBLE_A = ctx.createPattern(makeCobble(false), 'repeat');
  COBBLE_B = ctx.createPattern(makeCobble(true), 'repeat');
}

// ----- frame -----
function render(dt) {
  TIME += dt;
  GRADE = Math.round(S.warmth * 20);
  const z = cam.zoom = cam.baseZoom * cam.userZoom;
  // camera clamp
  const hw = VW / 2 / z, hh = VH / 2 / z;
  cam.x = clamp(cam.x, hw, W - hw); cam.y = clamp(cam.y, Math.min(140 + hh, WH / 2), WH - hh);
  if (hw * 2 > W) cam.x = W / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#4c6b3c'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (VW / 2 - cam.x * z), DPR * (VH / 2 - cam.y * z));
  const view = { x0: cam.x - hw - 80, x1: cam.x + hw + 80, y0: cam.y - hh - 160, y1: cam.y + hh + 120 };

  // ground
  const sx = Math.max(0, view.x0) * GSCALE, sy = Math.max(0, view.y0) * GSCALE;
  const sw = Math.min(W, view.x1) * GSCALE - sx, sh = Math.min(WH, view.y1) * GSCALE - sy;
  ctx.globalAlpha = 1;
  ctx.drawImage(GROUND_DRAB, sx, sy, sw, sh, sx / GSCALE, sy / GSCALE, sw / GSCALE, sh / GSCALE);
  ctx.globalAlpha = smooth(clamp(S.warmth * 1.15, 0, 1));
  ctx.drawImage(GROUND_LUSH, sx, sy, sw, sh, sx / GSCALE, sy / GSCALE, sw / GSCALE, sh / GSCALE);
  ctx.globalAlpha = 1;
  drawRoads();
  drawWater();
  drawGroundDetails(view);

  // y-sorted scene
  const items = [];
  const vis = (x, y, pad = 200) => x > view.x0 - pad && x < view.x1 + pad && y > view.y0 - 40 && y < view.y1 + pad + 80;
  for (const t of TREES) if (vis(t.x, t.y)) items.push({ y: t.y, f: () => drawTree(t) });
  for (const k in BUILDINGS) { const b = BUILDINGS[k]; if (vis(b.x + b.w / 2, b.y + b.d, 260)) items.push({ y: b.y + b.d, f: () => drawBuilding(k, b) }); }
  items.push({ y: 682, f: drawStoreStall });
  for (const p of PROPS) if (vis(p.x, p.y)) items.push({ y: p.y, f: () => drawProp(p) });
  addProjectItems(items, vis);
  for (const id of RES_IDS) { const n = NPCS[id]; if (n.visible && vis(n.x, n.y)) items.push({ y: n.y, f: () => drawNPC(id, n) }); }
  if (PIP.visible) items.push({ y: PIP.y, f: () => drawPerson(ctx, PIP.x, PIP.y, PIP_LOOK, { facing: PIP.facing, phase: PIP.phase, moving: PIP.moving, mood: 'happy', scale: 0.68 }) });
  for (const w of WORKERS) if (w.visible && vis(w.x, w.y)) items.push({ y: w.y, f: () => drawBot(ctx, w.x, w.y, w.color, { worker: true, carry: w.carry, facing: w.facing, t: TIME + w.seed }) });
  const P = S.player;
  items.push({ y: P.y, f: () => drawPerson(ctx, P.x, P.y, P.look, { facing: P.facing || 1, phase: P.phase || 0, moving: P.moving, mood: 'happy', back: P.dirY < -0.5 && P.moving, k: 0.45 }) });
  const B = S.bot;
  items.push({ y: B.y, f: () => drawBot(ctx, B.x, B.y, B.color, { facing: B.facing || 1, t: TIME, mood: BOT_FX.mood }) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.f();

  drawParticles(dt, view);
  drawLighting(view);
  drawOverlays();
}

// ----- roads, plaza -----
function drawRoads() {
  const w = smooth(clamp(S.warmth * 1.15, 0, 1));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const path = r => { ctx.beginPath(); r.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); };
  for (const r of ROADS) { path(r); ctx.strokeStyle = col('#8a6440', 0.6); ctx.lineWidth = r.w + 12; ctx.stroke(); }
  // plaza
  ctx.fillStyle = col('#8a6440', 0.65); ellipse(ctx, PLAZA.x, PLAZA.y, PLAZA.rx + 9, PLAZA.ry + 8); ctx.fill();
  for (const [pat, a] of [[COBBLE_A, 1], [COBBLE_B, w]]) {
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    for (const r of ROADS) { path(r); ctx.strokeStyle = pat; ctx.lineWidth = r.w; ctx.stroke(); }
    ctx.fillStyle = pat; ellipse(ctx, PLAZA.x, PLAZA.y, PLAZA.rx, PLAZA.ry); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // plaza rings
  ctx.strokeStyle = col('#a3876a', 0.6); ctx.lineWidth = 3;
  for (const k of [0.45, 0.75]) { ellipse(ctx, PLAZA.x, PLAZA.y - 6, PLAZA.rx * k, PLAZA.ry * k); ctx.stroke(); }
}

// ----- water -----
function streamPoly() {
  if (streamPoly.c) return streamPoly.c;
  const L = [], R = [];
  for (let i = 0; i < STREAM.length; i++) {
    const [x, y] = STREAM[i];
    const a = STREAM[Math.max(0, i - 1)], b = STREAM[Math.min(STREAM.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy); dx /= d; dy /= d;
    const hw = STREAM_W / 2 + Math.sin(i * 1.7) * 4;
    L.push([x - dy * hw, y + dx * hw]); R.push([x + dy * hw, y - dx * hw]);
  }
  streamPoly.c = { L, R };
  return streamPoly.c;
}
function smoothPath(pts, close) {
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
}
function drawWater() {
  const { L, R } = streamPoly();
  const water = col('#4f8fae'), deep = col('#3b6f91'), lite = col('#8fc9dc');
  // stream
  ctx.beginPath(); smoothPath(L); const rr = [...R].reverse(); ctx.lineTo(rr[0][0], rr[0][1]);
  for (let i = 1; i < rr.length; i++) ctx.lineTo(rr[i][0], rr[i][1]);
  ctx.closePath();
  const gr = ctx.createLinearGradient(1900, 0, 2120, 0);
  gr.addColorStop(0, water); gr.addColorStop(0.5, deep); gr.addColorStop(1, water);
  ctx.fillStyle = gr; ctx.fill();
  // pond + pool
  for (const P of [POND, POOL]) {
    const g2 = ctx.createRadialGradient(P.x, P.y, 10, P.x, P.y, P.rx);
    g2.addColorStop(0, deep); g2.addColorStop(1, water);
    ctx.fillStyle = g2; ellipse(ctx, P.x, P.y, P.rx, P.ry); ctx.fill();
  }
  // flowing highlights
  ctx.strokeStyle = col('#cdeaf2', 0.55); ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < STREAM.length - 1; i++) {
    const [ax, ay] = STREAM[i], [bx, by] = STREAM[i + 1];
    for (let k = 0; k < 5; k++) {
      const t = ((TIME * 0.18 + k / 5 + i * 0.13) % 1);
      const x = lerp(ax, bx, t) + Math.sin(k * 3 + i) * 16, y = lerp(ay, by, t);
      ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.quadraticCurveTo(x, y - 2, x + 6, y); ctx.stroke();
    }
  }
  for (const P of [POND, POOL]) for (let k = 0; k < 9; k++) {
    const a = k * 0.7 + TIME * 0.05, r = 0.25 + (k % 3) * 0.22;
    const x = P.x + Math.cos(a) * P.rx * r, y = P.y + Math.sin(a * 1.3) * P.ry * r;
    ctx.globalAlpha = 0.35 + 0.3 * Math.sin(TIME * 1.5 + k);
    ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.quadraticCurveTo(x, y - 2.5, x + 8, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // lily pads when the town warms up
  if (S.warmth > 0.35) {
    const R2 = rng(9);
    for (let i = 0; i < 14; i++) {
      const a = R2() * TAU, r = 0.35 + R2() * 0.5;
      const x = POND.x + Math.cos(a) * POND.rx * r, y = POND.y + Math.sin(a) * POND.ry * r;
      ctx.fillStyle = col('#5f9a4a'); ctx.beginPath(); ctx.ellipse(x, y, 10, 6, 0, 0.3, TAU); ctx.lineTo(x, y); ctx.fill();
      if (i % 3 === 0 && S.warmth > 0.6) { ctx.fillStyle = col('#f7b6c8'); circle(ctx, x + 2, y - 2, 3.2); ctx.fill(); }
    }
  }
  // waterfall
  const fx0 = 1950, fx1 = 2030;
  const wg = ctx.createLinearGradient(0, 120, 0, 300);
  wg.addColorStop(0, col('#a9d8e6')); wg.addColorStop(1, col('#dff3f7'));
  ctx.fillStyle = wg;
  ctx.beginPath(); ctx.moveTo(fx0, 124); ctx.lineTo(fx1, 118); ctx.lineTo(fx1 + 14, 300); ctx.lineTo(fx0 - 12, 300); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col('#ffffff', 0.7); ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const x = fx0 + 4 + i * 6;
    const off = ((TIME * 120 + i * 37) % 180);
    ctx.beginPath(); ctx.moveTo(x, 120 + off); ctx.lineTo(x + 1, 120 + off + 26); ctx.stroke();
  }
  // foam
  ctx.fillStyle = col('#ffffff', 0.75);
  for (let i = 0; i < 10; i++) { circle(ctx, fx0 - 10 + i * 11, 300 + Math.sin(TIME * 4 + i) * 3, 8 + Math.sin(TIME * 3 + i * 2) * 2); ctx.fill(); }
  if (Math.random() < 0.3) spawn('mist', fx0 + Math.random() * 80, 300, { vx: (Math.random() - 0.5) * 10, vy: -8 - Math.random() * 8, life: 2.5 });
  // bridge
  const b = BRIDGE;
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; rrect(ctx, b.x1 + 34, b.y2 - 2, b.x2 - b.x1 - 70, 10, 4); ctx.fill();
  ctx.fillStyle = col('#a0866a'); rrect(ctx, b.x1 + 28, b.y1 + 2, b.x2 - b.x1 - 56, b.y2 - b.y1 - 4, 6); ctx.fill();
  ctx.strokeStyle = col('#7a634c'); ctx.lineWidth = 1.5;
  for (let x = b.x1 + 36; x < b.x2 - 30; x += 10) { ctx.beginPath(); ctx.moveTo(x, b.y1 + 4); ctx.lineTo(x, b.y2 - 4); ctx.stroke(); }
  ctx.fillStyle = col('#c9b291'); ctx.fillRect(b.x1 + 26, b.y1 - 6, b.x2 - b.x1 - 52, 6); ctx.fillRect(b.x1 + 26, b.y2 - 3, b.x2 - b.x1 - 52, 5);
}

// ----- ground-level details -----
const GROUND_BITS = [];
function buildGroundBits() {
  const R = rng(4242);
  for (let i = 0; i < 520; i++) {
    const x = 30 + R() * (W - 60), y = 280 + R() * (WH - 300);
    if (roadDist(x, y) < 8 || inWater(x, y) || nearAnyLot(x, y, 4)) continue;
    GROUND_BITS.push({ x, y, k: R() < 0.55 ? 'tuft' : 'flower', c: ['#fff4dc', '#ffd34e', '#f78fb0', '#b48cf0', '#ff8f5a', '#7fc3ff'][(R() * 6) | 0], th: R(), s: 0.7 + R() * 0.6 });
  }
}
function drawGroundDetails(view) {
  const w = S.warmth;
  for (const g of GROUND_BITS) {
    if (g.x < view.x0 || g.x > view.x1 || g.y < view.y0 || g.y > view.y1) continue;
    if (g.k === 'tuft') {
      ctx.strokeStyle = col('#4f7f36'); ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let i = -2; i <= 2; i++) { ctx.moveTo(g.x + i * 2, g.y); ctx.quadraticCurveTo(g.x + i * 3, g.y - 5, g.x + i * 4 + Math.sin(TIME * 2 + g.x) * 1.2, g.y - 9 * g.s); }
      ctx.stroke();
    } else if (g.th < w * 1.1) {
      const sway = Math.sin(TIME * 1.8 + g.x * 0.1) * 1.2;
      ctx.strokeStyle = col('#4f8a3a'); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(g.x + sway, g.y - 7 * g.s); ctx.stroke();
      ctx.fillStyle = col(g.c);
      for (let p = 0; p < 5; p++) { const a = p / 5 * TAU; circle(ctx, g.x + sway + Math.cos(a) * 2.4 * g.s, g.y - 7 * g.s + Math.sin(a) * 2.4 * g.s, 1.8 * g.s); ctx.fill(); }
      ctx.fillStyle = col('#ffe08a'); circle(ctx, g.x + sway, g.y - 7 * g.s, 1.3 * g.s); ctx.fill();
    }
  }
  drawTeoGarden();
  drawLotsGround();
  // fountain basin is ground-level
  drawFountain();
}

function drawTeoGarden() {
  const x = 470, y = 1250, w = 160, h = 120;
  const thriving = H('teo').stage === 'thriving' || (H('teo').stage === 'easing' && H('teo').energy > 50);
  const lush = H('teo').stage === 'thriving';
  ctx.fillStyle = col(thriving ? '#6b4a32' : '#7d6a52'); rrect(ctx, x, y, w, h, 10); ctx.fill();
  const R = rng(31);
  for (let r = 0; r < 4; r++) {
    const yy = y + 20 + r * 26;
    if (thriving) { ctx.strokeStyle = col('#5a3c28'); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 12, yy + 6); ctx.lineTo(x + w - 12, yy + 6); ctx.stroke(); }
    for (let i = 0; i < 7; i++) {
      const px = x + 18 + i * 20 + (R() - 0.5) * 6, py = yy + (R() - 0.5) * 6;
      if (lush) {
        // artichoke plants: silver-green leaves with purple heads
        ctx.fillStyle = col('#7fa88a');
        for (let l = 0; l < 5; l++) { const a = -Math.PI / 2 + (l - 2) * 0.55; ctx.beginPath(); ctx.ellipse(px + Math.cos(a) * 6, py + Math.sin(a) * 5, 7, 2.6, a, 0, TAU); ctx.fill(); }
        if ((i + r) % 2 === 0) { ctx.fillStyle = col('#8a4f9e'); circle(ctx, px, py - 7, 4); ctx.fill(); ctx.fillStyle = col('#b07cc4'); circle(ctx, px - 1, py - 8, 1.6); ctx.fill(); }
      } else {
        ctx.strokeStyle = col(thriving ? '#6f9a4a' : '#8a8a52'); ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let k = 0; k < 4; k++) { ctx.moveTo(px, py); ctx.lineTo(px + (R() - 0.5) * 16, py - 6 - R() * 9); }
        ctx.stroke();
      }
    }
  }
  // fence
  ctx.strokeStyle = col('#9b8262'); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x - 6, y + h + 6); ctx.lineTo(x + w + 6, y + h + 6); ctx.stroke();
  for (let i = 0; i <= 8; i++) { ctx.beginPath(); ctx.moveTo(x - 6 + i * (w + 12) / 8, y + h + 6); ctx.lineTo(x - 6 + i * (w + 12) / 8, y + h - 8); ctx.stroke(); }
}

function drawLotsGround() {
  // overgrown lot (until the greenhouse goes up)
  const G = LOTS.greenhouse, gp = S.projects.greenhouse;
  if (gp.status !== 'online' && gp.status !== 'building') {
    ctx.fillStyle = col('#8a7d58'); rrect(ctx, G.x, G.y, G.w, G.d, 14); ctx.fill();
    const R = rng(55);
    for (let i = 0; i < 22; i++) {
      const x = G.x + 16 + R() * (G.w - 32), y = G.y + 16 + R() * (G.d - 26), r = 8 + R() * 10;
      ctx.fillStyle = col('#5d7a3c'); circle(ctx, x, y, r); ctx.fill();

function drawFountain() {
  const { x, y } = POI.fountain;
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ellipse(ctx, x + 4, y + 8, 62, 36); ctx.fill();
  ctx.fillStyle = col('#cdb894'); ellipse(ctx, x, y, 60, 36); ctx.fill();
  ctx.fillStyle = col('#a8916e'); ellipse(ctx, x, y + 4, 60, 34); ctx.fill();

// ----- trees -----
function drawTree(t) {
  const { x, y } = t, s = t.s;
  const R = rng(Math.floor(t.seed * 1000) + 1);
  const sway = Math.sin(TIME * 0.9 + t.seed) * 1.3 * (S.weather === 'storm' ? 3 : 1);
  ctx.fillStyle = 'rgba(25,30,20,0.22)'; ellipse(ctx, x + 8 * s, y + 2, 26 * s, 9 * s); ctx.fill();
  if (t.kind === 'cypress') {
    ctx.fillStyle = col('#5a4632'); ctx.fillRect(x - 2.5, y - 12 * s, 5, 12 * s);
    const g = ctx.createLinearGradient(x - 14 * s, 0, x + 14 * s, 0);
    g.addColorStop(0, col('#4f7a3f')); g.addColorStop(1, col('#2f5530'));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x, y - 8 * s);
    ctx.bezierCurveTo(x - 16 * s, y - 20 * s, x - 13 * s + sway, y - 70 * s, x + sway * 1.5, y - 98 * s);
    ctx.bezierCurveTo(x + 13 * s + sway, y - 70 * s, x + 16 * s, y - 20 * s, x, y - 8 * s); ctx.fill();
    ctx.strokeStyle = col('#1f3420', 0.6); ctx.lineWidth = 1.8; ctx.stroke();
    ctx.strokeStyle = col('#68924f', 0.6); ctx.lineWidth = 1.5;
    for (let i = 0; i < 6; i++) { const yy = y - 20 * s - i * 12 * s; ctx.beginPath(); ctx.moveTo(x - 6 * s + sway * i / 6, yy); ctx.quadraticCurveTo(x - 2 * s, yy - 6 * s, x + 2 * s, yy - 2 * s); ctx.stroke(); }
    return;
  }
  if (t.kind === 'bush') {
    const bl = []; for (let i = 0; i < 5; i++) bl.push([x + (R() - 0.5) * 22 * s, y - 8 * s - R() * 10 * s, (9 + R() * 6) * s]);
    ctx.fillStyle = col('#1f3a1c', 0.7); for (const [bx, by, br] of bl) { circle(ctx, bx, by, br + 1.8); ctx.fill(); }
    bl.forEach(([bx, by, br], i) => { ctx.fillStyle = col(i < 3 ? '#467a30' : '#62983e'); circle(ctx, bx, by, br); ctx.fill(); });
    ctx.fillStyle = col('#93c457', 0.8); for (const [bx, by, br] of bl.slice(2)) { circle(ctx, bx - br * 0.3, by - br * 0.35, br * 0.45); ctx.fill(); }
    if (S.warmth > 0.5 && t.seed % 2 < 1) { ctx.fillStyle = col('#f48fb1'); for (let i = 0; i < 6; i++) { circle(ctx, x + (R() - 0.5) * 24 * s, y - 6 * s - R() * 16 * s, 2.2); ctx.fill(); } }
    return;
  }
  const olive = t.kind === 'olive', lemon = t.kind === 'lemon';
  ctx.strokeStyle = col(olive ? '#6e5e4a' : '#6b4f36'); ctx.lineWidth = 6 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + (olive ? 6 : 2) * s, y - 14 * s, x + sway * 0.5, y - 28 * s); ctx.stroke();
  if (olive) { ctx.lineWidth = 3.5 * s; ctx.beginPath(); ctx.moveTo(x + 2 * s, y - 16 * s); ctx.lineTo(x - 10 * s, y - 28 * s); ctx.stroke(); }
  const base = olive ? '#66844c' : lemon ? '#356f26' : '#326c24';
  const mid = olive ? '#869f62' : lemon ? '#4f8a30' : '#4a862e';
  const hi = olive ? '#b4c682' : lemon ? '#8ab848' : '#90bc48';
  const cy = y - (olive ? 40 : 48) * s;
  const blobs = [];
  for (let i = 0; i < 7; i++) blobs.push([x + (R() - 0.5) * 38 * s + sway, cy + (R() - 0.5) * 26 * s, (13 + R() * 9) * s]);
  ctx.fillStyle = col('#1f3420', 0.65); for (const [bx, by, br] of blobs) { circle(ctx, bx, by + 4, br + 2); ctx.fill(); }
  ctx.fillStyle = col(base); for (const [bx, by, br] of blobs) { circle(ctx, bx, by + 4, br); ctx.fill(); }
  ctx.fillStyle = col(mid); for (const [bx, by, br] of blobs) { circle(ctx, bx - 2, by, br * 0.86); ctx.fill(); }
  ctx.fillStyle = col(hi, 0.85); for (const [bx, by, br] of blobs.slice(0, 4)) { circle(ctx, bx - br * 0.3, by - br * 0.35, br * 0.42); ctx.fill(); }
  if (lemon && S.warmth > 0.25) { ctx.fillStyle = col('#ffd84a'); for (let i = 0; i < 7; i++) { circle(ctx, x + (R() - 0.5) * 36 * s + sway, cy + (R() - 0.2) * 22 * s, 2.8); ctx.fill(); } }
  if (!olive && !lemon && S.warmth > 0.72 && t.seed % 3 < 1) { ctx.fillStyle = col('#ffd0dc'); for (let i = 0; i < 10; i++) { circle(ctx, x + (R() - 0.5) * 40 * s + sway, cy + (R() - 0.5) * 26 * s, 2); ctx.fill(); } }
}

// ----- buildings -----
// Buildings are drawn as little dioramas: a front face, a shaded right-hand side

const SIDE_X = 24, SIDE_Y = 14;

function sideWall(x, top, front, color, sd = SIDE_X, sk = SIDE_Y) {

  ctx.fillStyle = col('#7c6e5c');

  ctx.strokeStyle = inkCol(); ctx.lineWidth = 1.8; ctx.lineJoin = 'round';

// ground shadow cast to the lower right, plus a soft contact shadow along the front

  ctx.beginPath(); ctx.moveTo(x + w + sd, front - sk); ctx.lineTo(x + w + sd + 30, front - sk + 8); ctx.lineTo(x + w + 30, front + 12); ctx.lineTo(x + 6, front + 12); ctx.lineTo(x, front); ctx.closePath(); ctx.fill();
  const g = ctx.createLinearGradient(0, front - 2, 0, front + 10);
  g.addColorStop(0, 'rgba(40,26,30,0.3)'); g.addColorStop(1, 'rgba(40,26,30,0)');

// side slope and ridge of a hip roof; returns nothing, outlines the whole roof
function roofSide(x0, x1, yb, yt, inset, color, sd = SIDE_X, sk = SIDE_Y) {
  ctx.fillStyle = col(shade(color, -0.26));
  ctx.beginPath(); ctx.moveTo(x1, yb); ctx.lineTo(x1 + sd, yb - sk); ctx.lineTo(x1 - inset + sd, yt - sk); ctx.lineTo(x1 - inset, yt); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col(shade(color, -0.45), 0.5); ctx.lineWidth = 1.1;
  for (let j = 1; j < 6; j++) { const t = j / 6; ctx.beginPath(); ctx.moveTo(lerp(x1, x1 - inset, t), lerp(yb, yt, t)); ctx.lineTo(lerp(x1 + sd, x1 - inset + sd, t), lerp(yb - sk, yt - sk, t)); ctx.stroke(); }
  ctx.fillStyle = col(shade(color, 0.18));
  ctx.beginPath(); ctx.moveTo(x0 + inset, yt); ctx.lineTo(x1 - inset, yt); ctx.lineTo(x1 - inset + sd, yt - sk); ctx.lineTo(x0 + inset + sd, yt - sk); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = inkCol(); ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(x1, yb); ctx.lineTo(x1 + sd, yb - sk); ctx.lineTo(x1 - inset + sd, yt - sk); ctx.lineTo(x0 + inset + sd, yt - sk); ctx.lineTo(x0 + inset, yt); ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = inkCol(0.45); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x1, yb); ctx.lineTo(x1 - inset, yt); ctx.lineTo(x1 - inset + sd, yt - sk); ctx.stroke();
}
function roofTiles(x0, x1, yb, yt, inset, color, rows, side) {
  const g = ctx.createLinearGradient(0, yt, 0, yb);
  g.addColorStop(0, col(shade(color, 0.12))); g.addColorStop(1, col(shade(color, -0.12)));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(x1, yb); ctx.lineTo(x1 - inset, yt); ctx.lineTo(x0 + inset, yt); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = col(shade(color, -0.3), 0.55); ctx.lineWidth = 1.2;
  const n = rows || Math.floor((yb - yt) / 8);
  for (let j = 1; j <= n; j++) {
    const yy = lerp(yb, yt, j / (n + 0.5));
    const t = (yb - yy) / (yb - yt);
    const lx = lerp(x0, x0 + inset, t), rx = lerp(x1, x1 - inset, t);
    ctx.beginPath();
    for (let xx = lx; xx < rx; xx += 9) { ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx + 4.5, yy + 4, xx + 9, yy); }
    ctx.stroke();
  }
  ctx.strokeStyle = col(shade(color, 0.25), 0.35);
  const cols = Math.floor((x1 - x0) / 9);
  for (let i = 1; i < cols; i++) {
    const bx = lerp(x0, x1, i / cols), tx = lerp(x0 + inset, x1 - inset, i / cols);
    ctx.beginPath(); ctx.moveTo(bx, yb); ctx.lineTo(tx, yt); ctx.stroke();
  }
  ctx.restore();
  if (side) { roofSide(x0, x1, yb, yt, inset, color); return; }
  ctx.strokeStyle = col(shade(color, -0.35)); ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0 + inset, yt); ctx.lineTo(x1 - inset, yt); ctx.stroke();
}
function wallRect(x, y, w, h, color, seed) {
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, col(shade(color, 0.08))); g.addColorStop(1, col(shade(color, -0.1)));
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  const R = rng(seed);
  for (let i = 0; i < 10; i++) { ctx.fillStyle = col(shade(color, (R() - 0.5) * 0.18), 0.35); ellipse(ctx, x + R() * w, y + R() * h, 6 + R() * 14, 4 + R() * 8); ctx.fill(); }
  // stone base
  ctx.fillStyle = col('#9a8a74'); ctx.fillRect(x, y + h - 12, w, 12);
  ctx.strokeStyle = col('#7c6e5c'); ctx.lineWidth = 1;
  for (let i = 0; i < w; i += 14) { ctx.strokeRect(x + i + ((i / 14) % 2) * 4, y + h - 12, 14, 6); ctx.strokeRect(x + i, y + h - 6, 14, 6); }
  // quoins
  ctx.fillStyle = col(shade(color, -0.12));
  for (let j = 0; j < h - 14; j += 14) { ctx.fillRect(x, y + j, (j / 14) % 2 ? 7 : 11, 12); ctx.fillRect(x + w - ((j / 14) % 2 ? 7 : 11), y + j, (j / 14) % 2 ? 7 : 11, 12); }
